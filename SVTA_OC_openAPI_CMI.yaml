openapi: 3.0.1
info:
  title: Open Caching API - Cache Management Interface (COI)
  description: "This is the Open Caching API model as exposed by an ISP( dCDN) according to the Streaming Video Technology Alliance (SVTA). It exposes API and data model object elements for content management in the dCDN  Open Caching infrastructure."
  contact:
    email: guillaume.bichot@broadpeak.tv
  version: 1.0.0
externalDocs:
  description: "Corresponding SVTA 2046 specification"
  url: "https://www.svta.org/product/svta2046/"
security:
  - bearerToken: []
paths:
  # Trigger v1 API
  /OC/CMI/triggers:
    post:
      tags:
        - OC_CMI_trigger
      summary: For the uCDN to allow the dCDN fetching the content in its cache infrastructure thanks to the CI/trigger API and SVTA extensions.
      description: "To create a new trigger "
      operationId: OC_CMI_createTrigger
      requestBody:
        description: "The trigger command metadatas or a link to be considered/processed by the ISP. For triggering the creation of a trigger command related to cached content. The URL(s) present in the ci-trigger-commnd metadata.urls property should conform to the callbacks format (see below)."
        content:
          application/cdni;ptype=ci-trigger-command:
            schema:
              $ref: './SVTA_OC_openAPI_Trigger.yaml#/components/schemas/ci-trigger-command'
        required: true
      callbacks:
        requestContent:
          /OC/CMI/content/{pathName}:
            get:
              summary: "" 
              description: "This callback is used by the ISP OC/dCDN to retrieve the content elements referenced in the ci-trigger-command."
              tags:
                - OC_CMI
              operationId: OC_CMI_getContent
              parameters:
                - name: pathName
                  in: path
                  description: 'The calbback url has a fqdn part followed by the mandatory "OC/CMI/content" followed by a path sufixe associated with the content object to be retrieved according to the MI API.'
                  required: true
                  schema:
                    type: string
                    format: uri
              responses:
                200:
                  description: "Returns the requested content (either a file or a playlist gathering the list of files to pre-position)."
                  content:
                    text/plain:
                      schema:
                        type: string
                        format: binary
                404:
                  description: Not found.
                  content: {}
      responses:
        201:
          description: Created.
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                $ref: './SVTA_OC_openAPI_Trigger.yaml#/components/schemas/ci-trigger-status'
          links:
            getTriggerId:
              operationId: OC_CMI_status
              parameters:
                triggerId: "$response.header.Location"
                description: 'The value returned in the "Location" header of the HTTP response is the URI to be used with "GET /OC/CI/status/{triggerId}".'
        400:
          description: Command is invalid.
          content: {}
        403:
          description: Forbidden.
          content: {}
    get:
      summary: "Fetch the trigger collection"
      description: "According to the RFC 8007 for the Trigger protcol"
      tags:
        - OC_CMI_trigger
      operationId: OC_CMI_collection
      responses:
        200:
          description: "list of triggers"
          content:
            application/cdni;ptype=ci-trigger-collection:
              schema:
                $ref: "./SVTA_OC_openAPI_Trigger.yaml#/components/schemas/ci-trigger-collection"
        400:
          description: Command is invalid.
          content: {}
        403:
          description: Forbidden.
          content: {}
  /OC/CMI/triggers/{triggerId}:
    parameters:
      - name: triggerId
        in: path
        description: 'The triggerId parameter corresponds to the "Location" header of the response corresponding to the POST OC/CMI/trigger API.'
        required: true
        schema:
          type: string
          format: Url-path-style
    get:
      summary: "Check the CI trigger status."
      description: "According to RFC 8007 for the Trigger protocol."
      tags:
        - OC_CMI_trigger
      operationId: OC_CMI_status
      responses:
        200:
          description: "the Trigger status"
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                $ref: "./SVTA_OC_openAPI_Trigger.yaml#/components/schemas/ci-trigger-status"
        400:
          description: Command is invalid.
          content: {}
        403:
          description: Forbidden.
          content: {}
    delete:
      summary: "delete the corresponding trigger resource"
      description: "According to SVA OpenCaching specification and RFC 8007 for the Trigger protcol and RFC 8006."
      tags:
        - OC_CMI_trigger
      operationId: OC_CMI_delete
      responses:
        200:
          description: "trigger command deleted"
          content: {}
        400:
          description: Command is invalid.
          content: {}
        403:
          description: Forbidden.
          content: {}
        404:
          description: "Not found"
          content: {}
  # Trigger v2 API SVTA 2046
  /OC/CMI/{bucketIdType}/{bucketId}/triggers:
    parameters:
      - name: bucketIdType
        in: path
        description: "All cache management operations, except for cache bucket management, take place in the context of a cache bucket, indicated in all interface requests."
        required: true
        schema:
          type: string
          enum: [name, id]
      - name: bucketId
        in: path
        description: 'The bucket name ("default" is the name of the default bucket ) or bucket ID'
        required: true
        schema:
          type: string
    post:
      tags:
        - OC_CMI_trigger_v2
      summary: For the uCDN to allow the dCDN fetching the content in its cache infrastructure thanks to the CI/trigger API and SVTA extensions.
      description: "To create or modify a trigger "
      operationId: OC_CMI_createTriggerRessource
      requestBody:
        description: "A trigger ressource for content management. The URL(s) present in the specs property should conform to the callbacks format (see below)."
        content:
          application/cdni;ptype=ci-trigger-command.create.v2:
            schema:
              description: 'CMI 1.0'
              $ref: "./SVTA_OC_openAPI_Trigger.yaml#/components/schemas/ci-trigger-command-create-v2"
          application/cdni;ptype=ci-trigger-command.modify.v2:
            schema:
              description: 'CMI 1.0'
              $ref: "./SVTA_OC_openAPI_Trigger.yaml#/components/schemas/ci-trigger-command-modify-v2"          
          application/cdni;ptype=ci-trigger.v2:
            schema:
              description: 'CMI 1.1'
              $ref: "./SVTA_OC_openAPI_Trigger.yaml#/components/schemas/ci-trigger-v2"
        required: true
      callbacks:
        requestContent:
          /OC/CMI/content/{pathName}:
            get:
              summary: ""
              description: "This callback is used by the ISP OC/dCDN to retrieve the content elements referenced in the ci-trigger-ressource."
              tags:
                - OC_MI
              operationId: OC_CMI_getContent
              parameters:
                - name: pathName
                  in: path
                  description: 'The calbback url has a fqdn part followed by the mandatory "OC/CMI/content" followed by a path sufixe associated with the content object to be retrieved according to the MI API.'
                  required: true
                  schema:
                    type: string
                    format: uri
              responses:
                200:
                  description: "Returns the requested content (either a file or a playlist gathering the list of files to pre-position)."
                  content:
                    text/plain:
                      schema:
                        type: string
                        format: binary
                404:
                  description: Not found.
                  content: {}
      responses:
        201:
          description: Created.
          content:
            application/cdni;ptype=ci-trigger-status.v2:
              schema:
                description: 'CMI 1.0'
                $ref: "./SVTA_OC_openAPI_Trigger.yaml#/components/schemas/ci-trigger-v2"
            application/cdni;ptype=ci-trigger.v2:
              schema:
                description: 'CMI 1.1'
                $ref: "./SVTA_OC_openAPI_Trigger.yaml#/components/schemas/ci-trigger-v2"
          links:
            getTriggerId:
              operationId: OC_CMI_status
              parameters:
                triggerId: "$response.header.Location"
                description: 'The value returned in the "Location" header of the HTTP response is the URI to be used with "GET /OC/CI/status/{triggerId}".'
        400:
          description: Command is invalid.
          content: {}
        403:
          description: Forbidden.
          content: {}
    get:
      summary: "Fetch all trigger collections"
      description: "According to the SVTA2046"
      tags:
        - OC_CMI_trigger_v2
      operationId: OC_CMI_indexCollectionResource
      responses:
        200:
          description: "list of triggers"
          content:
            application/cdni;ptype=ci-trigger-collection:
              schema:
                description: 'CMI 1.0'
                $ref: './SVTA_OC_openAPI_Trigger.yaml#/components/schemas/ci-trigger-collection-v2-14'
            application/cdni;ptype=ci-trigger-index.v2:
              schema:
                description: 'CMI 1.1'
                $ref: './SVTA_OC_openAPI_Trigger.yaml#/components/schemas/ci-trigger-index-v2'
        304:
          description: "not modified."
          content: {}
        400:
          description: Command is invalid.
          content: {}
        403:
          description: Forbidden.
          content: {}
  /OC/CMI/{bucketIdType}/{bucketId}/triggers/{triggerId}:
    parameters:
      - name: bucketIdType
        in: path
        description: "All cache management operations, except for cache bucket management, take place in the context of a cache bucket, indicated in all interface requests. the way to identify the bucket"
        required: true
        schema:
          type: string
          enum: [name, id]
      - name: bucketId
        in: path
        description: 'The bucket name ("default" is the name of the default bucket ) or bucket ID'
        required: true
        schema:
          type: string
      - name: triggerId
        in: path
        description: 'The triggerId parameter corresponds to the "Location" header of the response corresponding to the POST OC/CMI/trigger API.'
        required: true
        schema:
          type: string
          format: Uri
    get:
      summary: "Check the CI trigger."
      description: "According to SVA OpenCaching Cache management specification (SVTA2046)."
      tags:
        - OC_CMI_trigger_v2
      operationId: OC_CMI_triggerResourceCheck
      responses:
        200:
          description: "A trigger ressource for content management."
          content:
            application/cdni;ptype=ci-trigger-status.v2:
              schema:
                description: 'CMI 1.0'
                $ref: "./SVTA_OC_openAPI_Trigger.yaml#/components/schemas/ci-trigger-status-v2"
            application/cdni;ptype=ci-trigger.v2:
              schema:
                description: 'CMI 1.1'
                $ref: "./SVTA_OC_openAPI_Trigger.yaml#/components/schemas/ci-trigger-v2"
        304:
          description: "not modified."
          content: {}
        400:
          description: Command is invalid.
          content: {}
        403:
          description: Forbidden.
          content: {}
    delete:
      summary: "delete the corresponding trigger resource"
      description: "According to SVA OpenCaching specification 2046."
      tags:
        - OC_CMI_trigger_v2
      operationId: OC_CMI_deleteResource
      responses:
        200:
          description: "trigger command deleted"
          content: {}
        204:
          description: "trigger command delete request accepted"
        400:
          description: Command is invalid.
          content: {}
        403:
          description: Forbidden.
          content: {}
        404:
          description: "Not found"
          content: {}
        501:
          description: "Not implemented"
          content: {}
    post:
      tags:
        - OC_CMI_trigger_v2
      summary: "Mofication of a trigger resource according to SVTA2046"
      description: 'Modification of existing triggers is useful for uCDN to correct an error in trigger specification or trigger extension(s) that may govern when the trigger is to be processed. uCDN can request modification of an existing trigger resource by sending an updated trigger representation to the trigger URI using HTTP POST command. dCDN MAY accept modifications of the trigger specifications, trigger extensions and trigger labels, when the trigger is in a "pending" state, i.e., dCDN did not start its processing yet. dCDN MAY also accept a request to change the trigger state subject to the following constraints: the requested state is "cancelled", and the trigger was in either "pending" or "active" state when dCDN receives the request; the requested state is "active", and the trigger was in a "pending" state when dCDN received the request'
      operationId: OC_CMI_modifyTriggerResource
      requestBody:
        description: "A trigger ressource for content management. The URL(s) present in the specs property should conform to the callbacks format (see below)."
        content:
          application/cdni;ptype=ci-trigger.v2:
            schema:
              $ref: "./SVTA_OC_openAPI_Trigger.yaml#/components/schemas/ci-trigger-v2"
        required: true
      responses:
        200:
          description: Modification has been processed.
          content:
            application/cdni;ptype=;ptype=ci-trigger.v2:
              schema:
                $ref: "./SVTA_OC_openAPI_Trigger.yaml#/components/schemas/ci-trigger-v2"
          links:
            getTriggerId:
              operationId: OC_CI_status
              parameters:
                triggerId: "$response.header.Location"
                description: 'The value returned in the "Location" header of the HTTP response is the URL to be used with "GET /OC/CI/status/{triggerId}".'
        202:
          description: Modification accepted but not yet complete.
          content:
            application/cdni;ptype=;ptype=ci-trigger.v2:
              schema:
                $ref: "./SVTA_OC_openAPI_Trigger.yaml#/components/schemas/ci-trigger-v2"
          links:
            getTriggerId:
              operationId: OC_CI_status
              parameters:
                triggerId: "$response.header.Location"
                description: 'The value returned in the "Location" header of the HTTP response is the URL to be used with "GET /OC/CI/status/{triggerId}".'
        400:
          description: Command is invalid.
          content: {}
        404:
          description: "Not found"
          content: {}
        409:
          description: "Conflict."
          content: {}
        501:
          description: "Not implemented"
          content: {}
  /OC/CMI/{bucketIdType}/{bucketId}/triggers/{filter}:
    parameters:
      - name: bucketIdType
        in: path
        description: "All cache management operations, except for cache bucket management, take place in the context of a cache bucket, indicated in all interface requests. the way to identify the bucket"
        required: true
        schema:
          type: string
          enum: [name, id]
      - name: bucketId
        in: path
        description: 'The bucket name ("default" is the name of the default bucket ) or bucket ID'
        required: true
        schema:
          type: string
      - name: filter
        in: path
        description: 'Specifies the filter value used to select the triggers in the collection. For per-label trigger collections, this attribute MUST contain the corresponding label value. For per-state trigger collections, it MUST contain the trigger state shared by all triggers in the collection.'
        required: true
        schema:
          oneOf:
            - $ref: "./SVTA_OC_openAPI_Trigger.yaml#/components/schemas/CI_status"
            - $ref: "./SVTA_OC_openAPI_Trigger.yaml#/components/schemas/CI_triggerLabel"
    get:
      summary: "Check the CI trigger collection."
      description: "According to SVA OpenCaching Cache management specification (SVTA2046 release 1 and above)."
      tags:
        - OC_CMI_trigger_v2
      operationId: OC_CMI_triggerResourceCollectionCheck
      responses:
        200:
          description: "A trigger ressource collection for content management."
          content:
            application/cdni;ptype=ci-trigger-collection.v2:
              schema:
                $ref: './SVTA_OC_openAPI_Trigger.yaml#/components/schemas/ci-trigger-collection-v2'
        304:
          description: "not modified."
          content: {}
        400:
          description: Command is invalid.
          content: {}
        403:
          description: Forbidden.
          content: {}

  # Bucket API
  /OC/CMI/bucket/{bucketNameOrId}:
    parameters:
      - name: bucketNameOrId
        in: path
        required: true
        description: "bucket name or ID"
        schema:
          type: string
    put:
      tags:
        - OC_CMI_bucket
      summary: "When creating a new cache bucket the parameter bucketNameOrID MUST be  considered as a name; uniqueness of the bucket name, per tenant, is enforced. If a bucket exist with the same name then it is considered as a modification request (an ID exist). In case of successful object creation, the dCDN allocates a unique bucket identifier for subsequent trigger requests for the bucket, and returns cache bucket status. The special bucket “default” is automatically allocated and assigned to all tenant objects."
      description: ""
      operationId: OC_CMI_bucket_create_modify
      requestBody:
        description: "Bucket structure partially filed as e.g. (name, type, quota)"
        content:
          application/json;:
            schema:
              $ref: "#/components/schemas/CMI.CacheBucket"
        required: true
      responses:
        200:
          description: "Bucket (full) structure modified. "
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CMI.CacheBucket"
        201:
          description: "bucket (full) structure created."
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                $ref: "#/components/schemas/CMI.CacheBucket"
        400:
          description: "Command is invalid. "
        403:
          description: Forbidden.
        404:
          description: "Not found. There was no bucket with that ID or name "
        409:
          description: "Conflict"
        500:
          description: "server error"
    get:
      description: "To query an individual cache bucket object"
      tags:
        - OC_CMI_bucket
      operationId: OC_CMI_bucket_read
      responses:
        200:
          description: "Bucket full structure"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CMI.CacheBucket"
        400:
          description: "Command is invalid. "
        403:
          description: Forbidden.
        404:
          description: "Not found. There was no Bucket"
    delete:
      description: "To delete an individual cache bucket object. A cache bucket can be deleted only when there is no active uCDN configuration utilizing it."
      tags:
        - OC_CMI_bucket
      operationId: OC_CMI_bucket_delete
      responses:
        200:
          description: "Bucket status"
        400:
          description: "Command is invalid. "
        403:
          description: Forbidden.
        404:
          description: "Not found. There was no Bucket"
  /OC/CMI/bucket/:
    get:
      description: "To query the collection of cache bucket objects"
      tags:
        - OC_CMI_bucket
      operationId: OC_CMI_bucket_readall
      responses:
        200:
          description: "Bucket objects list."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CMI.CacheBucket"
        400:
          description: "Command is invalid. "
        403:
          description: Forbidden.
        404:
          description: "Not found. There was no Bucket"
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # MI (configuration) objects
    MI_CMI_payloadtype:
      type: string
      enum: [MI.CacheBucketRef, MI.GroupingExtended, MI.CachePriority]
    MI_CMI_payloadvalue:
      oneOf:
        - $ref: "#/components/schemas/MI.CacheBucketRef"
        - $ref: "#/components/schemas/MI.GroupingExtended"
        - $ref: "#/components/schemas/MI.CachePriority"
        - $ref: "#/components/schemas/MI.ObjectList"
    MI.CacheBucketRef:
      type: object
      description: "object used for linking configuration metadata objects to CMI.CacheBucket objects managed by the Cache Management Interface using the Cache Bucket API. This object provides a reference to the cache bucket using the Cache Management Interface URI, and optionally specifies which footprint(s) it is to be applied to. When used without footprint(s), MI.CacheBucketRef can be used to bind a specific type of content (e.g. images) or uCDN configuration subset with a cache bucket. The footprint further supports cache separation based on geography and/or multiple cache layers within dCDN."
      required:
        - bucket-url
      properties:
        bucket-uri:
          description: "URI uniquely identifying an CMI.CacheBucket"
          type: string
          format: url
        footprints:
          description: "OPTIONAL footprints to be applied to the cache bucket, as published by the dCDN, using FCI"
          type: array
          items:
            $ref: "./SVTA_OC_openAPI_COI.yaml#/components/schemas/MI.Footprint"
    MI.GroupingExtended:
      type: object
      description: "The MI.GroupingExtended object is an alternative to the CDNI standard MI.Grouping object that defines the association of a configuration with content collection identifiers. Usage of MI.GroupingExtended metadata is exclusive of MI.Grouping usage."
      required:
        - type
      properties:
        type:
          description: "Type of grouping. The “wildcard” grouping will match all objects stored under the parent object (MI.HostData or MI.PathMetadata). The “header-match” grouping will derive the identifier from the response header provided with the object (e.g., “Surrogate-Key”)."
          type: string
          enum: [wildcard, header-match]
        ccid:
          description: "Array of content collection identifiers"
          type: array
          items:
            type: string
        ccid-header:
          description: 'Response header(s) used to define the content collection identifier. dCDN SHOULD reject use of standard HTTP headers in this context. if no element is provided, the default header assumed is : "Surrogate-Key”'
          type: array
          items:
            type: string
    MI.CachePriority:
      type: object
      description: "The MI.CachePriority object defines the association of configuration sections with a response header used by the uCDN to communicate cache priority of the objects in that configuration section. uCDN SHOULD use one priority header in a response. In case of multiple priority headers encountered in the same response, dCDN MAY use any one of them to set the object priority."
      required:
        - cache-priority-header
      properties:
        cache-priority-header:
          description: "Response header(s) used to define the cache priority. dCDN SHOULD reject use of standard HTTP headers in this context."
          type: array
          items:
            type: string
    MI.ObjectList:
      type: object
      description: 'ObjectList is a metadata object describing lists of objects that can be used in the context of CI/T v2 trigger spec, trigger status resources and other contexts as required.The ObjectList object can either embed the lists of objects or point to external URL(s)that hold such lists. ObjectList allows specification of an object list type, providing instructions on the interpretation of the object list format.'
      properties:
        data:
          description: "List of objects in one of recognized formats. Either “data” or “href” MUST be set."
          type: string
        href:
          description: "URL pointing to an external object list or object in one of recognized formats. Either “data” or “href” MUST be set"
          type: string
          format: Uri
        type:
          description: "Object list type to be used when parsing and interpreting this object list. By default each record in the list is assumed to represent an object that does not require additional processing."
          type: string
          enum: [“hls”, “dash”, “mss”, “text”, “json”]
    # CMI objects
    CMI.CacheBucket:
      type: object
      required:
        - name
        - type
      properties:
        name:
          description: "Bucket name. The reserved name “default” is associated with a default bucket provisioned for each tenant, which encompasses all footprints. The default bucket cannot be deleted. The bucket name can be changed after it is created. The bucket name should be unique for each uCDN tenant."
          type: string
        id:
          description: "Unique bucket identifier. MUST only be communicated from the dCDN to the uCDN. The unique bucket identifier is allocated by the interface at bucket creation time and is used for all interface queries that are directed to a specific bucket."
          type: string
        status:
          description: "Current bucket status. The bucket is marked active when there is an active CDN configuration associated with it. In absence of an active configuration, the bucket is marked idle and can be removed. Additionally, the storage buckets MAY be degraded or offline when some or all objects stored within  are no longer available, due to a fault."
          type: string
          enum: [“active”, “idle”, “degraded”, “offline”]
        type:
          description: "Bucket type.This property is immutable and cannot be changed after the bucket is created."
          type: string
          enum: [storage, cache]
        quota:
          description: "Quota associated with the bucket, in Kilobytes. If not specified, the dCDN does not enforce a quota for the cache bucket."
          type: integer
        metrics:
          description: "List of status metrics associated with the bucket provided for “storage” cache buckets only"
          type: array
          items:
            type: object
            properties:
              cacheObjects:
                description: "Number of cache objects in the bucket"
                type: integer
              storageUsage:
                description: "Storage usage in Kbytes"
                type: integer
    CI_CMI_triggerExtensionType:
      type: string
      enum:
        [
          preposition-policy,
          schedule-policy,
          purge-policy,
        ]
    CI_CMI_triggerExtensionValue:
          description: "CDNI trigger extension object"
          oneOf:
            - $ref: '#/components/schemas/CI_CMI_schedulePolicy'
            - $ref: '#/components/schemas/CI_CMI_prepositionPolicy'
    CI_CMI_schedulePolicy:
      description: "Schedule specifying when the trigger SHOULD run, consisting of one or more schedule windows. Each one of the windows in the schedule MAY be a one-off time window, or have a recurrence associated with it. The schedules are encoded using JSON-based iCalendar (jCal) format. jCal is specified in [RFC7265], and describes JSON encoding of the iCalendar standard [RFC5545]."
      required:
        - schedule
      properties:
        schedule:
          description: 'Schedule specifying when the trigger SHOULD run,consisting of one or more schedule windows. JSON-encoded jCal object'
          type: string
    CI_CMI_purgePolicy:
      description: 'The purge policy extension specifies how the dCDN manages purge trigger requests. The main purpose of this extension is to provide support for copyright infringement and similar content takedown use case requirements.'
      required:
        - schedule
      properties:
        delete-objects:
          description: 'Policy regulating purging of objects from the dCDN cache nodes. If set to “True”, the dCDN MUST delete the objects from its cache nodes before completing the trigger. Otherwise, the dCDN MAY mark the purged objects as no longer available to end-users before the trigger completion and defer the actual purge to a later time.'
          type: boolean
          default: false
    CI_CMI_prepositionPolicy:
      description: 'The PrepositionPolicy extension specifies how the dCDN manages pre-positioning trigger requests.'
      properties:
        preposition-methods-allowed:
          description: 'Policy to determine what HTTP methods the dCDN SHOULD utilize to retrieve cache objects specified in the trigger. By specifying only “HEAD” or “OPTIONS”, the uCDN MAY indicate that the trigger is used to propagate cache hints only, without actually retrieving cache objects. When specifying “GET” only, the uCDN indicates compulsory retrieval of the objects. If the uCDN specifies both “GET”, as well as “HEAD” or “OPTIONS” method, this indicates that the uCDN defers to the dCDN whether to treat the trigger as a “cache hint” or a “pre-positioning” trigger.'
          type: array
          items:
            type: string
            enum: [GET, HEAD, OPTIONS]
        preposition-retry-max:
          description: 'Maximum number of attempts to retrieve an object before failing the trigger'
          type: integer
          default: 1
        preposition-retry-interval:
          description: 'Timeout value, in seconds, before retrying a pre-positioning request.'
          type: integer
        preposition-byte-range-allowed:
          description: 'Byte range requests supported for pre-positioning'
          type: boolean
          default: True
        preposition-partial-retrieval:
          description: 'Policy to determine whether the dCDN is allowed to retrieve cache objects specified by the trigger partially - including both failure to pre-position multiple objects specified by the trigger itself (e.g., multiple objectlists in the “content-objectlists” attribute) and cache objects referenced by an objectlist. As the default behavior, the dCDN stops objectlist retrieval when encountering an error and reports a trigger failure. The uCDN SHOULD utilize the extended Trigger v2 Status to query the dCDN about the list of objects that could not be retrieved.'
