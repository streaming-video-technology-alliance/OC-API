    MI_GenericMetadata:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.GenericMetadata'    
    MI.GenericMetadata:
      type: object
      description: 'GenericMetadata object extended by SVA.'
      required:
        - generic-metadata-type
        - generic-metadata-value
      properties:
        generic-metadata-type:
          $ref: '#/components/schemas/MI_metadatatype'
        generic-metadata-value:
           $ref: '#/components/schemas/MI_metadatavalue'
        mandatory-to-enforce:
          type: boolean
          description: 'Flag identifying whether or not the enforcement of the property metadata is required.'
          default: true
        safe-to-redistribute:
          type: boolean
          description: 'Flag identifying whether or not the property metadata can be safely redistributed without modification.'
          default: true
        incomprehensible:
          type: boolean
          description: 'Flag identifying whether or not any CDN in the chain of delegation has failed to understand and/or failed to properly transform this metadata object.  Note: This flag only applies to metadata objects whose safe-to-redistribute property has a value of False.'           
    
    MI_AllowCompress:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.AllowCompress'
    MI.AllowCompress:
      type: object
      description: 'AllowCompress is a new GenericMetadata object that allows the dCDN to compress content before sending to the client.'
      properties:
        allow-compress:
          description: 'If set to true, then the dCDN will try to compress the response to the client based on the Accept-Encoding request header.'
          type: boolean
          default: false
      example:
        value: {
                    "allow-compress": true
                }
    MI_ClientConnectionControl:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.ClientConnectionControl'
    MI.ClientConnectionControl:
      type: object
      description: 'ClientConnectionControl is a new GenericMetadata object that specifies how a dCDN manages its connections to clients/players. When not specified, a default value selected by the dCDN will be used.'
      properties:
        connection-keep-alive-time-ms:
          description: 'Specifies the time in milliseconds to keep an idle connection open.'
          type: integer
    MI_CachePolicy:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.CachePolicy'
    MI_cachepolicy_iors:
      type: string
      pattern: '^as-is|no-cache|no-store|\d+$'
    MI.CachePolicy:
      type: object
      properties:
        internal:  
          description: 'This property is used to specify the (internal) cache control policy to be used by the dCDN.The value of the cache policy is in seconds, for example “5” is a five second cache. The following special values are also supported: "as-is", "no-cache", "no-store". If not used, the default is to use the cache control policy specified in the HTTP response from the uCDN.' 
          $ref: '#/components/schemas/MI_cachepolicy_iors'
          default: as-is
        external:  
          description: 'This property is used to specify the (external) cache control policy to be used by clients of this dCDN. The value of the cache policy is in seconds. The following special values are also supported: "as-is", "no-cache", "no-store". “no-cache”. If not used, the default is to use the cache control policy specified in the HTTP response from the uCDN.'
          $ref: '#/components/schemas/MI_cachepolicy_iors'
          default: as-is
        force-internal:  
          description: 'If set to True, the metadata interface cache policy defined in the MI.CachePolicy internal property value will override any cache control policy set in the response from the uCDN. If set to False, the MI.CachePolicy internal property value is only used if there is no cache control policy provided in the response from the uCDN.. The default is False, which will apply the MI.CachePolicy internal property value only if no policy is provided in the response from the uCDN.'
          type: boolean
          default: false
        force-external:  
          description: 'If set to True, the metadata interface cache policy defined in the MI.CachePolicy external property value will override any cache control policy set in the response from the uCDN. If set to False, the MI.CachePolicy external property value is only used if there is no cache control policy provided in the response from the uCDN. The default is False, which will apply the MI.CachePolicy external property value only if no policy is provided in the response from the uCDN.'
          type: boolean
          default: false
      example:
        value:  {
                  "internal": "as-is",
                  "external": "no-cache",
                  "force-internal": true,
                  "force-external": true
                  }
    MI_ComputedCacheKey:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.ComputedCacheKey'
    MI.ComputedCacheKey:
      type: object
      required:
        - expression
      properties:
        expression:
          description: 'An expression using CDNI-MEL to dynamically construct the cache key from elements of the HTTP request and/or response.'
          type: string
      example:
        value: {
          "expression" : "$req.h.X-Cache-Key",
          }
    MI_AccessControlAllowOrigin:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.AccessControlAllowOrigin'
    MI.AccessControlAllowOrigin:
        type: object
        description: 'Validation of simple CORS requests. Nested object of CrossoriginPolicy. '
        required:
          - allow-list
          - wildcard-return
        properties:
          allow-list:
            description: 'List of valid URLs that will be used to match the request origin header. The Origin header is a HTTP extension. Its value is a version of the Referer header in some specific requests, and used for Cross Origin requests. Permitted values are schema://hostname[:port] '
            type: array
            items: 
              $ref: '#/components/schemas/MI_PatternMatch'
          wildcard-return:
            description: 'If true, the OCN will include a wildcard (*) in the Access-Control-Allow-Origin response header. If false, the OCN will reflect back the request Origin header in the Access-Control-Allow-Origin response header.'
            type: boolean
    MI_CrossoriginPolicy:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.CrossoriginPolicy'
    MI.CrossoriginPolicy:
      type: object
      description: 'Controls the dynamically generated CORS headers.'
      required:
        - allow-origin
      properties:
        allow-origin:
          description: 'Validation of simple CORS requests.' 
          $ref: '#/components/schemas/MI_AccessControlAllowOrigin'
        expose-headers:
          description: 'A list of values the OCN will include in the Access-Control-Expose-Headers response header to a preflight request.'
          type: array
          items:
            type: string
        allow-methods:
          description: 'A list of values the OCN will include in the Access-Control-Allow-Methods response header to a preflight request.'
          type: array
          items:
            type: string
        allow-headers:
          description: 'A list of values the OCN will include in the Access-Control-Allow-Headers response header to a preflight request.'
          type: array
          items:
            type: string
        allow-credentials:
          description: 'The value the OCN will include in the Access-Control-Allow-Credentials response header to a preflight request.'
          type: boolean
        max-age:
          description: 'The value the OCN will include in the Access-Control-Max-Age response header to a preflight request.'
          type: integer
        no-origin-response-headers:
          description:  In the case of a request that has no Origin field, return this set of headers with the response.
          type: array
          items:
            $ref: '#/components/schemas/MI_HTTPHeader'
        preflight-only:
          description: Setting this flag to “True” the dCDN will only generate synthetic responses to OPTIONS requests with proper CORS response headers.
          type: boolean
          default: false
      example:
        value: {
              "allow-origin": {
              "allow-list": {
                "pattern": "*://sourcepage.example.com"},
                "wildcard-return": false
                },
              "allow-methods": ["GET","POST"],
              "allow-credentials": true,
              "allow-headers": ["X-PINGOTHER","Content-Type"],
              "expose-headers": ["X-User","Authorization"],
              "max-age": 3600
            }
    MI_NegativeCachePolicy:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.NegativeCachePolicy'
    MI.NegativeCachePolicy: 
      type: object
      description: 'Allows for the configuration of caching policies based on error response codes received from the origin.'
      required:
        - cache-policy
      properties:
        error-codes:
          description: 'Array of HTTP response error status codes (https://tools.ietf.org/html/rfc7231#page-47), that if returned from the uCDN, will be cached using the cache policy defined in cache-policy. By default the policy expressed in RFC8006 is applied. An empty or unspecified list may function as a means to revoke a list inherited from an upper level configuration.'
          type: array
          items:
            type: string
            description: Any HTTP status code from 100 to 599, or one of the special values  “4xx” or “5xx”, where “xx” implies everything from 00 to 99. Note that use of 4xx would specify that 416 responses are cached.
        cache-policy:
          description: 'MI.CachePolicy to apply to the HTTP response error status codes returned by the uCDN.'
          $ref: '#/components/schemas/MI_CachePolicy'
      example:
        value: {
          "error-codes": ["404", "503", "504"],
          "cache-policy": {
            "internal": 5,
            "external": "no-cache",
            "force-internal": true,
            "force-external": true
            }
          }
    MI_CacheBypassPolicy:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.CacheBypassPolicy'
    MI.CacheBypassPolicy:
      type: object
      description: 'Allows a client request to be set as non-cacheable.  It is expected that this feature will be used to allow clients to test the fill path to the uCDN.'
      properties:
        bypass-cache:
          description: 'A Boolean value that can activate the feature for a given client request.  It is expected that this feature will be used within ProcessingStages to allow a client request to be marked to bypass a cache.'
          type: boolean
          default: false
    MI_OcnDelivery:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.OcnDelivery'
    MI.OcnDelivery:
      description: 'This nested of object MI.OcnSelection is used to instruct the dCDN to perform delegation operating a particular medium and/or a transport arrangement. At least one of the two properties, ocn-type and ocn-delivery, must be present.'
      type: object
      properties:
        ocn-medium:
          description: 'This property is used to instruct the dCDN to perform delegation operating a particular medium. The following values are specified: “SATELLITE”, "CELLULAR", "BROADBAND", "TERRESTRIAL". At least one of the two properties, ocn-medium and ocn-transport, must be present.'
          type: string
          enum: [SATELLITE,CELLULAR,BROADBAND,TERRESTRIAL]
        ocn-transport:
          description: 'This property is used to instruct the dCDN to perform delegation operating a particular transport arrangement. The following values are specified: "MABR", "HAS". At least one of the two properties, ocn-medium and ocn-transport, must be present.'
          type: string
          enum: [MABR,HAS]
    MI_OcnSelection:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.OcnSelection'
    MI.OcnSelection:
      type: object
      description: 'Allows the uCDN to indicate to the dCDN a preference in terms of OCN selection.'
      properties:
        ocn-delivery:
          description: 'This property is used to instruct the dCDN to perform delegation operating a particular medium and/or a transport arrangement. At least one of the two properties, ocn-type and ocn-delivery, must be present.'
          $ref: '#/components/schemas/MI_OcnDelivery'
        ocn-type:
          description: 'This property is used to instruct the dCDN to perform delegation operating the type of Open Caching nodes corresponding to one of the Open Caching node types announced by the dCDN through the FCI interface. At least one of the two properties, ocn-type and ocn-delivery, must be present.'
          type: string
        ocn-selection:
          description: '“attempt-or-failed”  and  “attempt-or-besteffort” mean that the delegation must be attempted considering the ocn-type and/or the  ocn-acquisition properties. If not possible then it is considered as an error and either fails (configuration failure) or the dCDN continues through a best effort procedure . Last, “besteffort” means that the dCDN tries its best to fulfill the requested ocn-selection policy.'
          type: string
          enum: [attempt-or-failed, attempt-or-besteffort, besteffort]
          default: besteffort
    MI.NamedPrivateFeatureType:
      type: string
      description: 'A string in the form of MI.PrivateFeature.<org id>.<feature id> where org-id consists of alphanumeric characters, and feature-id may also contain dots for additional internal namespacing within the feature name'
      pattern: '^MI\.PrivateFeature\.[a-z0-9A-Z]+(?:\.[a-z0-9A-Z]+){1,}$'
    MI_NamedPrivateFeatureValue:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.NamedPrivateFeatureValue'
    MI.NamedPrivateFeatureValue:
      type: object
      description: 'The actual structure of the MI.NamedPrivateFeatureValue object would be the one defined in the property feature-value of the object MI.PrivateFeature'
    MI_PrivateFeatureList:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.PrivateFeatureList'
    MI.PrivateFeatureList:
      type: object
      description: 'A base generic object for controlling private features.'
      required:
        - features
      properties:
        features:
          description: 'The list of feature configuration objects.'
          type: array
          items:
            $ref: '#/components/schemas/MI_PrivateFeature'
    MI_PrivateFeature:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.PrivateFeature'
    MI.PrivateFeature:
      type: object
      description: 'A base generic object for controlling private features'
      required:
        - feature-oid
        - feature-type
      properties:
        feature-oid:
          description: 'The owner/organisation that has specified that feature.'
          type: string
        feature-type:
          description: This property is used to indicate the type/name of the private feature configuration object.
          type: string
        feature-value:
          description: 'Format/Type is defined by the value of the  feature-type property above'
          type: object
    MI_ProcessingStages:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.ProcessingStages'
    MI.ProcessingStages:
      type: object
      description: 'Describes the matching rules, metadata, and transformations to be applied at specific stages in the request processing pipeline.'
      properties:
        client-request:
          description: 'Allows for the specification of conditional metadata to be applied at client request processing stages. The StageRules in the array are evaluated in order.'
          type: array
          items: 
            $ref: '#/components/schemas/MI_StageRules'
        origin-request:
          description: 'Allows for the specification of conditional metadata to be applied at origin request processing stages. The StageRules in the array are evaluated in order.'
          type: array
          items:
             $ref: '#/components/schemas/MI_StageRules'
        origin-response:
          description: 'Allows for the specification of conditional metadata to be applied at origin response processing stages. The StageRules in the array are evaluated in order.'
          type: array
          items:
             $ref: '#/components/schemas/MI_StageRules'
        client-response:
          description: 'Allows for the specification of conditional metadata to be applied at client response processing stages. The StageRules in the array are evaluated in order.'
          type: array
          items:
             $ref: '#/components/schemas/MI_StageRules'
    MI_ClientRequestStage:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.ClientRequestStage'
    MI.ClientRequestStage:
      type: object
      description: 'Describes the matching rules, metadata, and transformations to be applied by the dCDN upon receiving an inbound HTTP request from a client prior to further processing.'
      required:
        - match-groups
      properties:
        match-groups:
          description: 'An array of if/else match groups that are processed in order, allowing for the specification of conditional metadata to be applied at this processing stage. Note that all  MI.MatchGroup objects in the array are evaluated and processed in order,  with processing only halted if the stage metadata generates a synthetic response or denies access via an ACL restriction.'
          type: array
          items:
             $ref: '#/components/schemas/MI_MatchGroup'
    MI_OriginRequestStage:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.OriginRequestStage'
    MI.OriginRequestStage:
      type: object
      description: 'Describes the matching rules, metadata, and transformations to be applied by the dCDN prior to making an HTTP request to the origin upon a cache miss.'
      required:
        - match-groups
      properties:
        match-groups:
          description: 'An array of if/else match groups that are processed in order, allowing for the specification of conditional metadata to be applied at this processing stage. Note that all  MI.MatchGroup objects in the array are evaluated and processed in order,  with processing only halted if the stage metadata generates a synthetic response or denies access via an ACL restriction.'
          type: array
          items:
             $ref: '#/components/schemas/MI_MatchGroup'
    MI_OriginResponseStage:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.OriginResponseStage'
    MI.OriginResponseStage:
      type: object
      description: 'Describes the matching rules, metadata, and transformations to be applied by the dCDN after an HTTP response is received from the origin and before being placed in the cache or forwarded to the client.'
      required:
        - match-groups
      properties:
        match-groups:
          description: 'An array of if/else match groups that are processed in order, allowing for the specification of conditional metadata to be applied at this processing stage. Note that all  MI.MatchGroup objects in the array are evaluated and processed in order,  with processing only halted if the stage metadata generates a synthetic response or denies access via an ACL restriction.'
          type: array
          items:
             $ref: '#/components/schemas/MI_MatchGroup'
    MI_ClientResponseStage:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.ClientResponseStage'
    MI.ClientResponseStage:
      type: object
      description: 'Describes the matching rules, metadata, and transformations to be applied by the dCDN prior to sending the HTTP response to the client. If the response is from the cache, rules are applied to the response retrieved from the cache prior to sending to the client.'
      required:
        - match-groups
      properties:
        match-groups:
          description: 'An array of if/else match groups that are processed in order, allowing for the specification of conditional metadata to be applied at this processing stage. Note that all  MI.MatchGroup objects in the array are evaluated and processed in order,  with processing only halted if the stage metadata generates a synthetic response or denies access via an ACL restriction.'
          type: array
          items:
             $ref: '#/components/schemas/MI_MatchGroup'
    MI_MatchGroup:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.MatchGroup'
    MI.MatchGroup:
      type: object
      description: 'MI.MatchGroup is a subobject of MI.ClientRequestStage, MI.ClientResponseStage,  MI.OriginRequestStage, and MI.OriginResposeStage, allowing for a structured set of if/else rules to be applied based on an OPTIONAL match of an expression.'
      required:
        - if-rule
      properties:
        if-rule:
          description: 'An MI.StageRules object that is always processed. If it contains a match expression that evaluates to "True" (or is an unconditional rule with no match expression), the metadata defined within the stage rule is applied and any else-if-rules are ignored.'
          $ref: '#/components/schemas/MI_StageRules'    
        else-if-rules:
          description: 'An array of  MI.StageRules objects that are processed in order whenever the if-rule does not terminate processing. If a stage rule expression match  evaluates to "True" (or is an unconditional rule with no match expression), the metadata defined within the stage rule is applied and all subsequent entries in the  else-if-rules are ignored. Processing is halted if the stage metadata generates a synthetic response or denies access via an ACL restriction.'
          type: array
          items:
             $ref: '#/components/schemas/MI_StageRules'        
    MI_StageRules:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.StageRules'
    MI.StageRules:
      type: object
      description: 'Used within the context of ProcessingStages to define elements in a list of match rules and stage-specific metadata and transformations that should be applied conditionally on a rich expression match.'
      properties:
        match:
          description: 'A match property encapsulates a rich expression using the CDNi Metadata Expression Language (CDNI-MEL) to evaluate aspects of the HTTP request and/or response. The stage-metadata rules are only applied if the match evaluates to true or if no match expression is provided.'
          $ref: '#/components/schemas/MI_ExpressionMatch'
        stage-metadata:
          description: 'The set of StageMetadata to be applied at the processing stage if the match expression evaluates to true or is not present. '
          $ref: '#/components/schemas/MI_StageMetadata'
    MI_ExpressionMatch:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.ExpressionMatch'
    MI.ExpressionMatch:
      type: object
      description: 'A rich expression using CDNI-MEL to evaluate aspects of the HTTP request and/or response. See documentation on the Metadata Expression Language for details on the expression of matching variables and syntax.'
      required:
        - expression
      properties:
        expression:
          type: string
    MI_StageMetadata:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.StageMetadata'
    MI.StageMetadata:
      type: object
      description: 'Contains GenericMetadata and HTTP request/response transformations that should be applied for a StageRules. All of the properties (capabilities) are optional and can be advertised via feature-flags in the FCI interface.'
      properties:
        generic-metadata:
          description: 'Specifies the set of GenericMetadata to be applied (in order) for a StageRules match. Note that not all GenericMetadata object types may be applicable at all processing stages. A typical use case would be the application of a CachePolicy or TimeWindowACL conditionally on matching HTTP headers. The generic-metadata property would not be needed when StageMetadata is used to only specify request or response transformations, such as modifications of HTTP headers.'
          type: array 
          items:
            $ref: '#/components/schemas/MI_GenericMetadata'
        request-transform:
          description: 'Specifies a transformation to be applied to the HTTP request for a StageRules match. The transformation can be the modification of any request header and/or the modification of the URI. Modifications are applied such that downstream processing stages receive the modified HTTP request as their input'
          $ref: '#/components/schemas/MI_RequestTransform'
        response-transform:
          description: 'Specifies a transformation to be applied to the HTTP response for a StageRules match. The transformation can be the modification of any response header, HTTP response status code, or the generation of a synthetic response. Modifications are applied such that downstream processing stages receive the modified HTTP response as their input.'
          $ref: '#/components/schemas/MI_ResponseTransform'
    MI_RequestTransform:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.RequestTransform'
    MI.RequestTransform:
      type: object
      description: 'Metadata for transforming the HTTP request for a specific StageRules. The transformation can be the modification of any request header and/or the modification of the URI. Modifications are applied such that downstream processing stages receive the modified HTTP request as their input.'
      properties:
        header-transform:
          description: 'A HeaderTransform object specifying HTTP request headers to add, replace, or delete.'
          $ref: '#/components/schemas/MI_HeaderTransform'
        uri:
          description: 'Replacement value for the HTTP request; either a literal (static string) or an expression using CDNI-MEL to dynamically construct a URI value from elements of the HTTP request and/or response.'
          type: string 
        uri-is-expression:
          description: 'Flag to signal whether the URI is a static string literal or a CDNI-MEL expression that needs to be dynamically evaluated.'
          type: boolean
          default: false
    MI_ResponseTransform:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.ResponseTransform'
    MI.ResponseTransform:
      type: object
      description: 'Metadata for transforming the HTTP response for a StageRules match. The transformation can be the modification of any response header, HTTP response status code, or the generation of a synthetic response. Modifications are applied such that downstream processing stages receive the modified HTTP response as their input.'
      properties:
        header-transform:
          description: 'A HeaderTransform object specifying HTTP request headers to add, replace, or delete.'
          $ref: '#/components/schemas/MI_HeaderTransform'
        response-status:
          description: 'Replacement value for the HTTP response status code; either a static integer or an expression using CDNI-MEL that evaluates to an integer to dynamically generate an HTTP status code based on elements of the HTTP request and/or response. Expressions that do not evaluate to an integer shall be considered invalid and result in no override of origin-provided response status. '
          $ref: '#/components/schemas/MI_sori'
        status-is-expression:
          description: 'Flag to signal whether the response-status is a static integer or a CDNI-MEL expression that needs to be dynamically evaluated to generate an HTTP response status code.'
          type: boolean
          default: false
        synthetic:
          description: 'Specification of a complete replacement of any HTTP response that may have been generated in an earlier processing stage with a synthetic response. Use of this property to specify a synthetic response would override any response transformations or status codes specified by other properties.'
          $ref: '#/components/schemas/MI_SyntheticResponse'
    MI_sori:
      oneOf:
        - type: string
        - type: integer
    MI_SyntheticResponse:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.SyntheticResponse'
    MI.SyntheticResponse:
      type: object
      description: 'Specification of a synthetic response to be generated in response to the HTTP request being processed. The synthetic response can contain a set of response headers, a status code, and a response body, and is a complete replacement for any HTTP response elements generated in an earlier processing stage. A dynamically generated Content-Length HTTP response header is generated based on the length of the generated response body.'
      required:
        - response-status
      properties:
        headers:
          description: 'An array of HTTP header objects that specify the full set of headers to be applied to the synthetic response. The property is not mandatory, although it would be unusual to not specify minimal standard response headers, such as Content-Type.'
          type: array 
          items:
            $ref: '#/components/schemas/MI_HTTPHeader'
        response-status:
          description: 'HTTP response status code; either a static integer or an expression using CDNI-MEL that evaluates to an integer to dynamically generate an HTTP status code based on elements of the upstream HTTP request and/or response. Expressions that do not evaluate to an integer shall be considered invalid and result in a 500 status for the synthetic response.'
          $ref: '#/components/schemas/MI_sori'
        status-is-expression:
          description: 'Flag to signal whether the response-status is a static integer or a CDNI-MEL expression that needs to be dynamically evaluated to generate an HTTP response status code.'
          type: boolean
          default: false
        body:
          description: 'Body for the synthetic HTTP response. The response body can either be static or dynamically constructed from a rich expression; either a literal (static string) or an expression using CDNI-MEL to dynamically construct a response body from elements of the HTTP request and/or response. If this property is absent, an empty HTTP response with a zero-value Content-Length header is generated.'
          type: string
        body-is-expression:
          description: 'Flag to signal whether the synthetic response body is a static string literal, or a CDNI-MEL expression that needs to be dynamically evaluated.'
          type: boolean
          default: false
      example:
        value: {
                  "headers" : [
                  {"name" : "content-type", "value" : "text/plain"},
                  {"name" : "X-custom-response-header", "value" : "some static value"},
                  ],
                  "response-status" : 405,
                  "response-body" : "'Sorry, Access to resource ' . req.uri . ' is not allowed'",
                  "body-is-expression": true
                }
    MI_HeaderTransform:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.HeaderTransform'
    MI.HeaderTransform:
      type: object
      description: 'Specifies how HTTP headers should be added, replaced, or deleted from HTTP requests and responses.'
      properties:
        add:
          description: 'List of HTTP headers (name/value pairs) that should be added to the HTTP request or response. Note that any existing headers in the request or response with the same names of those added are not affected (resulting in multiple headers with the same name).'
          type: array 
          items:
            $ref: '#/components/schemas/MI_HTTPHeader'
        replace:
          description: 'List of HTTP headers (name/value pairs) that should be added to the HTTP request or response, replacing any previous headers with the same name. Matching is not case sensitive. Both key and value are replaced wtih the provided case.'
          type: array 
          items:
            $ref: '#/components/schemas/MI_HTTPHeader'
        delete:
          description: 'List of names of HTTP headers that should be deleted from the HTTP request or response. If a named header appears multiple times, all occurrences are deleted. Matching is not case sensitive.'
          type: array 
          items:
            type: string 
      example:
        value: { "add" : [
                    {"name" : "X-custom-header1", "value" : "header-value 1"},
                    {"name" : "X-custom-header2", "value" : "header-value 2"}, ],
                  "replace" : [{"name" : "Accept-Encoding", "value" : "gzip, deflate, br"} ],
                  "delete" : ["Authorization", "Accept-Language"]
                }
    MI_HTTPHeader:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.HTTPHeader'
    MI.HTTPHeader:
      type: object
      description: 'Contains a name/value pair for an HTTP header to add or replace in a request or response. The CDNI-MEL expression language can be used to dynamically generate response values.'
      required:
        - name
        - value
      properties:
        name:
          type: string
          description: 'name of the HTTP header'
        value:
          type: string
          description: 'Either a literal (static string) or an expression using CDNI-MEL to dynamically construct a header value from elements of the HTTP request and/or response.'
        value-is-expression:
          description: 'Flag to signal whether the value is a static string literal, or a CDNI-MEL expression that needs to be dynamically evaluated.'
          type: boolean
          default: false
      example:
        value: {
                "name" : "X-custom-response-header",
                "value" : “$req.uri.query.session",
                “value-is-expression” : true
              }
    MI_RequestedCapacityLimits:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.RequestedCapacityLimits'
    MI.RequestedCapacityLimits:
      type: object  
      deprecated: true
      description: 'Allows the uCDN to communicate to the dCDN a desired change in the advertised traffic delegation limits for a given host and footprint.'
      required:
        - requested-limits
      properties: 
        requested-limits:
          description: 'A set of requested changes to the dCDN’s advertised FCI.CapacityLimits.'
          type: array
          items:
            $ref: '#/components/schemas/MI_RequestedCapacityLimit'
      example:
        value: {
                "requested-limits": [{
                    "limit-type": "egress",
                    "limit-value": 80000000000,
                    "footprints": [{
                      "footprint-type": "ipv4cidr",
                      "footprint-value": ["192.0.2.0/24", "198.51.100.0/24"]
                    }]
                  }]
                } 
    MI_RequestedCapacityLimit:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.RequestedCapacityLimit'
    MI.RequestedCapacityLimit:    
      type: object
      deprecated: true
      description: 'uCDN requested capacity limit'
      required:
        - limit-type
        - limit-value
        - footprints
      properties:
        limit-type:
          description: 'The limit type for which the change is requested: egress, requests, storage-size, storage-objects, sessions, or cache-size.'
          type: string
          enum: [egress, requests, storage-size, storage-objects, sessions, cache-size]
        limit-value:
          description: 'The requested new value for the limit: egress (bps), requests (requests per seconds), storage-size (total nbr of bytes), storage-objects (count of objects), sessions (count of sessions), or cache-size (total nbr of bytes).'
          type: integer
        footprints:
          description: 'dCDN footprints within the advertised FCI.CapacityLimits footprints for which this request applies.'
          type: array
          items:
            $ref: '#/components/schemas/MI_Footprint'
    MI_RequestRouting:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.RequestRouting'
    MI.RequestRouting:
      type: object
      description: 'Allows the uCDN to force the dCDN request routing mode(s) to be applied when working in iterative redirection mode. The list of redirection modes supported by the dCDN is advertised through the  FCI.RedirectionMode object. The list of request routing modes supported by the dCDN is advertised through the FCI.RequestRoutingMode object.'
      properties:
        request-routing-modes:
          description: 'This property is used to instruct the dCDN to perform request routing according to one or more preferred modes among those supported and advertised by the dCDN through the FCI.RequestRouting object. One must understand that forcing (instead of letting the dCDN request router select) one particular request routing mode may trigger some inefficiency in the request routing process. By default all request routing modes supported by the dCDN can be used by the dCDN as part of its request routing process.'
          type: array
          items: 
            type: string
            enum: [DNS, HTTP, MANIFEST_REWRITE]
    MI_ServiceIDs:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.ServiceIDs'
    MI.ServiceIDs:
      type: object
      description: 'Allows for the specification of two tiers of CDN-specific identifiers and names. The interpretation of these identifiers is implementation specific.'
      properties:
        service-id:
          description: 'A provider-specific identifier for the service (typically a customer account identifier); either a literal (static string) or an expression using CDNI-MEL to dynamically construct the ID from elements of the HTTP request and/or response.'
          type: string
        service-id-is-expression:
          description: 'Flag to signal whether the service-id is a static string literal or a CDNI-MEL expression that needs to be dynamically evaluated.'
          type: boolean
          default: false
        service-name:
          description: 'Human-readable name for the service-id.'
          type: string
        property-id:
          description: 'A provider-specific identifier for the property (typically identifies a child configuration within the parent service-id); either a literal (static string) or an expression using CDNI-MEL to dynamically construct the ID from elements of the HTTP request and/or response.'
          type: string
        property-id-is-expression:
          description: 'Flag to signal whether the property-id is a static string literal or a CDNI-MEL expression that needs to be dynamically evaluated.'
          type: boolean
          default: false
        property-name:
          description: 'Human-readable name for the property-id.'
          type: string
      example:
        value: {
                "service-id" : "12345",
                "service-name" : "My Streaming Service",
                "property-id" : "$path_element(req.uri, 1)",
                "property-id-is-expression" : true
                }
    MI_SourceMetadataExtended:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.SourceMetadataExtended'
    MI.SourceMetadataExtended:
      type: object
      description: 'An alternative to the CDNi standard SourceMetadata object, which adds a property to specify load balancing across multiple sources, as well as a SourceExtended sub-object with additional attributes to the CDNi standard Source object. While both SourceMetadataExtended and SourceMetadata can be provided for backward compatibility, a dCDN that advertises capability for SourceMetadataExtended will ignore SourceMetadata if both are provided for a given host or path match.'
      properties:
        sources:
          description: 'Sources from which the dCDN can acquire content, listed in order of preference.'
          type: array 
          items:
              $ref: '#/components/schemas/MI_SourceExtended'
        source-detention:
          description: 'Specifies rules for handling detention at the set of sources.'
          $ref: '#/components/schemas/MI_SourceDetention'
        load-balance:
          description:  'Specifies load balancing rules for the set of sources.' 
          $ref: '#/components/schemas/MI_LoadBalanceMetadata'
      example:
        value: {
                "sources": [{ 
                    "endpoints": ["a.service123.ucdn.example","b.service123.ucdn.example"],
                    "protocol": "http/1.1"},
                  {
                    "endpoints": ["origin.service123.example"],
                    "protocol": "http/1.1"
                  }],
                "load-balance":{
                      "balance-algorithm": "content-hash",
                      "balance-path-pattern": "^/prod/(.*)/.*\\.ts$"
                      }
                }
    MI_SourceExtended:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.SourceExtended'
    MI.SourceExtended:
      description: 'An alternative to the CDNi standard MI.Source object with additional metadata. It inherits all the attributes of the Source object (acquistion-auth, endpoints, and protocol), with the following additional properties.'
      allOf:
        - $ref: '#/components/schemas/MI.Source'
        - $ref: '#/components/schemas/MI_SourceExt'
      example:
        value: {
                "endpoints": [
                        "a.service123.ucdn.example",
                        "b.service123.ucdn.example:8443"
                        ],
                "protocol": "https/1.1",
                "origin-host": "internal.example.com",
                "webroot": "/prod",
                "follow-redirects": false,
                "timeout-ms": 4000,
                "failover-errors": [ "502", "503", "504" ]
                }
    MI_SourceExt:
      type: object
      properties:
        origin-host:
          description: 'HTTP host header to be used instead of the hostname of each endpoint when retrieving content from the source. The host MUST conform to the Domain Name System (DNS) syntax defined in RFC-1034 and RFC-1123.'
          type: string
        sni-host:
          description: 'The Server Name Indication (SNI) to be used during the TLS handshake when establishing a secure connection with an endpoint. The sni-host MUST conform to the Domain Name System (DNS) syntax defined in [RFC1034] and [RFC1123]'
          type: string
        endpoint-is-expression:
          description: 'If the endpoint-is-expression property is set to “True”,  the value of the endpoint will be evaluated as a MEL expression'
          type: boolean
        origin-host-is-expression:
          description: 'If the origin-host-is-expression property is set to “True”,  the value of the origin-host will be evaluated as a MEL expression'
          type: boolean
        sni-host-is-expression:
          description: 'If the sni-host-is-expression property is set to “True”,  the value of the sni-host will be evaluated as a MEL expression'
          type: boolean
        webroot:  
          description: The path element that is prepended to a resource's URI before retrieving content from the source. 
          type: string
        follow-redirects:
          description: 'If the follow-redirects property is set to True, HTTP redirect responses returned from the source will be followed when retrieving content.  Otherwise, the HTTP redirect response is returned to the client.'
          type: boolean
          default: true
        timeout-ms: 
          description: 'A timeout (in milliseconds) to apply when connecting to the source server.  If the connection is not established within timeout-ms, this source is abandoned and the next source in the MI.SourceMetadataExtended sources array is tried.  Once a connection is established, timeout-ms is used on subsequent reads of data from the uCDN.'
          type: integer
        failover-errors: 
          description: 'Array of HTTP response error status codes (https://tools.ietf.org/html/RFC-7231, page-47), that if returned from the uCDN, will trigger a failover to the next source in the MI.SourceMetadataExtended sources array.  If the uCDN returns an HTTP error code that is not in the failover-errors array, that error code is returned to the client of the dCDN.'
          type: array
          items:
            type: string
            description: Any HTTP status code from 100 to 599, or one of the special values  “4xx” or “5xx”, where “xx” implies everything from 00 to 99. Note that use of 4xx would specify that 416 responses are cached.
        connection-control:
          description: 'Specifies how connection related errors and timeouts are handled. When specified, overrides the timeout-ms property'
          $ref: '#/components/schemas/MI_SourceConnectionControl'
        http-code-failover:
          description: 'Specifies how HTTP response error codes are handled. When specified, overrides the failover-errors property'
          $ref: '#/components/schemas/MI_HTTPCodeFailover'
        endpoint-detention:
          description: 'Defines error-based triggers for which an endpoint is put in detention (excluded from future use) for a given duration of time'
          $ref: '#/components/schemas/MI_EndpointDetention'
    MI_EndpointDetention:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.EndpointDetention'
    MI.EndpointDetention:
      type: object
      description: 'EndpointDetention is a subobject of SourceExtended that is used to track the health of an Endpoint (see [RFC8006] Section 4.3.3) and place in detention, if deemed unhealthy. Unhealthy EndPoints are not used for future HTTP requests until a set cool-off time is met. Error-based triggers are defined for which an endpoint can be put in detention for a given duration of time.'
      required:
        - detention-seconds
      properties:
        connection-setup-fail-trigger:
          description: 'A trigger for the connection setup error, including timeouts for connection establishment, that is fired for a given threshold of such errors.  If not specified, then no health check and detention is done for connection errors or connection timeout'
          $ref: '#/components/schemas/MI_EndpointDetentionTrigger'
        read-timeout-trigger:
          description: 'A trigger for the byte read timeout error that is fired for a given threshold of such errors.  If not specified, then no health check and detention is done for both first byte and byte read timeout errors.'
          $ref: '#/components/schemas/MI_EndpointDetentionTrigger'
        http-error-code-trigger:
          description: 'A list of error HTTP codes for which a trigger is fired for a given threshold of such error codes received from an Endpoint. If not specified, then no health check and detention is done upon receiving HTTP error codes.'
          $ref: '#/components/schemas/MI_HTTPErrorCodeTrigger'
        detention-seconds:
          description: 'The time in seconds for which an endpoint is put in detention (not used) after any of the error-based trigger fires. Values: A value greater than 0 to define a time in seconds for which an endpoint is put in detention (not used).'
          type: integer
    MI_EndpointDetentionTrigger:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.EndpointDetentionTrigger'
    MI.EndpointDetentionTrigger:
      type: object
      description: 'HttpErrorCodeTrigger is a subobject of EndpointDetention that defines a trigger for detention based on HTTP error codes. Any HTTP code received from an EndPoint that matches against the list of defined HTTP error codes counts against a single EndPointTrigger for detention.'
      required:
        - trigger-value
      properties:
        trigger-value:
          description: 'The threshold at which an Endpoint is triggered to unhealthy state and put in detention.'
          $ref: '#/components/schemas/MI_EndpointRepeatingFailures'
    MI_EndpointRepeatingFailures:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.EndpointRepeatingFailures'
    MI.EndpointRepeatingFailures:
      type: object
      description: 'EndpointRepeatingFailures is a subobject of EndpointDetentionTrigger that triggers an Endpoint to failure state if “event-count” of errors takes place during “time-window-millisec” while accounting for at least “fail-event-percent-threshold”% of the transactions to this endpoint during this period.'
      required:
        - event-count
        - time-window-millsec
      properties:
        event-count:
          description: 'The number of errors against an Endpoint within a duration of time-window-millsec.'
          type: integer
        time-window-millsec:
          description: 'The duration in milliseconds for which error statistics of event-count and fail-event-percent-threshold are tracked against an Endpoint.'
          type: integer
        fail-event-percent-threshold:
          description: 'The minimum percentage of errors against an Endpoint within a duration of time-window-millsec.  If not specified, then an EndPoint is triggered to an unhealthy state after encountering event-count errors without regards to the overall percentage of such errors.'
          type: integer
    MI_HTTPErrorCodeTrigger:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.HTTPErrorCodeTrigger'
    MI.HTTPErrorCodeTrigger:
      type: object
      description: 'HttpErrorCodeTrigger is a subobject of EndpointDetention that defines a trigger for detention based on HTTP error codes. Any HTTP code received from an EndPoint that matches against the list of defined HTTP error codes counts against a single EndPointTrigger for detention.'
      required:
        - trigger
        - error-codes
      properties:
        trigger:
          description: 'A trigger for HTTP error codes that is fired for a given threshold of such error codes received in HTTP responses.'
          $ref: '#/components/schemas/MI_EndpointDetentionTrigger'
        error-codes:
          description: 'Array of error HTTP response codes that when returned from an Endpoint can cause the Endpoint to be triggered into an unhealthy state. The error codes are from 400 to 599, or one of the special values  “4xx” or “5xx”, where “xx” implies everything from 00 to 99.'
          type: array
          items:
            type: string
    MI_SourceDetention:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.SourceDetention'
    MI.SourceDetention:
      type: object
      description: 'SourceDetention is a subobject of SourceMetadataExtended that defines detention rules at the set of sources.'
      properties:
        detention-full-behavior:
          description: 'Defines how a response is constructed when every Endpoint of each SourceMetadata has been put in detention. '
          $ref: '#/components/schemas/MI_DetentionFullBehavior'
        detention-reset-behavior:
          description: 'After every Endpoint of each SourceMetadata is put in detention, defines early removal of an EndPoint from detention without having served the full duration of detention. If not specified, then an Endpoint is removed from detention only upon the completion of the detention duration.'
          $ref: '#/components/schemas/MI_DetentionResetBehavior'
    MI_DetentionFullBehavior:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.DetentionFullBehavior'
    MI.DetentionFullBehavior:
      type: object
      description: 'A uCDN can configure how a response is constructed when all Endpoints are in detention.'
      properties:
        serve-if-stale-available:
          description: 'A stale version of the requested object is served back to the client. If no stale object exists, then other properties of DetentionFullBehavior apply.'
          type: boolean
          default: false
        synthetic-response:
          description: 'The synthetic response to return back to the client. If not specified, then the dCDN specific error response is used.'
          $ref: '#/components/schemas/MI_SyntheticResponse'
    MI_DetentionResetBehavior:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.DetentionResetBehavior'
    MI.DetentionResetBehavior:
      type: object
      description: 'When all Endpoints of a SourceMetadata are put in detention, this object allows a uCDN to define the early removal of an Endpoint from detention. Endpoints removed from detention through this behavior are available for immediate use for all subsequent client requests.'
      properties:
        reset-endpoints:
          description: 'The list of Endpoints to be removed from detention after no healthy Endpoints are available across all SourceExtended objects.  The default value is an empty array indicating that no Endpoints can be removed early from detention.'
          type: array
          items:
            $ref: '#/components/schemas/MI_endpoint'
        reset-all-endpoints:
          description: 'All Endpoints are removed from detention after no healthy Endpoints are available across all SourceExtended objects. The default value is False indicating that no Endpoints can be removed early from detention.'
          type: boolean
          default: false
    MI_SourceConnectionControl:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.SourceConnectionControl'
    MI.SourceConnectionControl:
      type: object
      description: 'SourceConnectionControl is a subobject of SourceExtended that allows for the dCDN to specify how it will handle connection timeouts and errors against the origin/uCDN. The mere use of this object overrides the timeout-ms property of SourceExtended, even if any timeout properties of this object are not configured.'
      properties:
        connection-setup-timeout-ms:
          description: 'The time in milliseconds within which a connection must be established against an endpoint of a MI.SourceExtended object.'
          type: integer
        connection-setup-timeout-ms-actions:
          description: 'Specifies error handling actions to take when the connection couldn’t be established within a given timeout, as specified by the connection-setup-timeout-ms property. It is an error to specify this property without the corresponding connection-setup-timeout-ms property.'
          $ref: '#/components/schemas/MI_SourceTimeoutActions'
        first-byte-read-timeout-ms:
          description: 'The time in milliseconds within which the first byte must be received/read on a new network connection.'
          type: integer
        first-byte-read-timeout-ms-actions:
          description: 'Specifies error handling actions to take when the first byte on a new connection couldn’t be read within a given timeout, as specified by the first-byte-read-timeout-ms property. It is an error to specify this property without the corresponding first-byte-read-timeout-ms property.'
          $ref: '#/components/schemas/MI_SourceTimeoutActions'
        byte-read-timeout-ms:
          description: 'A value greater than 0 to define a timeout in milliseconds for reading the next byte on an established network connection.'
          type: integer
        byte-read-timeout-ms-actions:
          description: 'Specifies error handling actions to take when the next byte on a connection couldn’t be read within a given timeout, as specified by the byte-read-timeout-ms property. It is an error to specify this property without the corresponding byte-read-timeout-ms property.'
          $ref: '#/components/schemas/MI_SourceByteReadTimeoutActions'
        connection-keep-alive-time-ms:
          description: 'Specifies the time in milliseconds to keep an idle connection open.'
          type: integer
        max-connection-retries-per-source:
          description: 'Specifies the upper bound of retries allowed across all endpoints of a MI.SourceExtended object for all timeout errors. A value greater than or equal to 0 indicating the maximum number of retries against all endpoints of the current MI.SourceExtended object for connection establishment, first-byte-read and byte-read timeout errors. A value of 0 indicates that no retries are to be performed against this source.'
          type: integer
        resume-from-last-byte-of-previous-source:
          description: 'Upon establishing a new connection to the Origin/uCDN, specifies whether the next byte to read will start from the last byte read from a previous MI.SourceExtended object. This is only applicable when the content length of the object being downloaded is known. If True, the next byte read will resume from the last successful byte downloaded from a previous MI.SourceExtended object. Default value is False.'
          type: boolean
          default: false
        resume-from-last-byte-of-previous-endpoint:
          description: 'Upon establishing a new connection to the Origin/uCDN, specifies whether the next byte read will start from the last byte read from a previous endpoint of the current MI.SourceExtended. This is only applicable when the content length of the object being downloaded is known.  If True, the next byte read will resume from the last successful byte downloaded from a previous endpoint of the current MI.SourceExtended object. Default value is False.'
          type: boolean
          default: false
    MI_SourceByteReadTimeoutActions:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.SourceByteReadTimeoutActions'
    MI.SourceByteReadTimeoutActions:
      type: object
      description: 'SourceByteReadTimeoutActions is a subobject of MI.SourceConnectionControl that allows for specifying the actions to be taken when a timeout happens when reading the next byte on an existing network connection against an endpoint of an Origin/uCDN.'
      properties:
        retries:
          description: 'Specifies the number of retries that MUST happen against a given endpoint when an error happens.'
          $ref: '#/components/schemas/MI_SourceConnectionRetries'
        error-state:
          description: 'Specifies whether to capture any error message for the current error condition.'
          $ref: '#/components/schemas/MI_SetVariable'
        resume-from-last-byte:
          description: 'Specifies whether to resume reading from the last byte of the current endpoint only if the content length of the object being downloaded is known.'
          type: boolean
          default: false
    MI_SourceTimeoutActions:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.SourceTimeoutActions'
    MI.SourceTimeoutActions:
      type: object
      description: 'SourceTimeoutActions is a subobject of MI.SourceConnectionControl that allows for specifying the actions to be taken when a timeout happens against an endpoint of an Origin/uCDN.'
      properties:
        retries:
          description: 'Specifies the number of retries that MUST happen against a given endpoint when an error happens.'
          $ref: '#/components/schemas/MI_SourceConnectionRetries'
        error-state:
          description: 'Specifies whether to capture any error message for the current error condition.'
          $ref: '#/components/schemas/MI_SetVariable'
    MI_SourceConnectionRetries:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.SourceConnectionRetries'
    MI.SourceConnectionRetries:
      type: object
      description: 'SourceConnectionRetries is a subobject that  allows for specifying retries to be performed against endpoints of a MI.SourceExtended object.'
      properties:
        max-retries-per-source:
          description: 'Specifies the maximum number of retries against all endpoints of the MI.SourceExtended object for a given class of error. Accepted values: A value of greater than or equal to 0 indicating the number of retries. Example: If the value of max-retries-per-source of the retries property of connection-setup-timeout-ms-actions is set to 5, then a maximum of 5 retries are allowed for connection-setup timeout errors across all endpoints of the current MI.SourceExtended object. If this value is set to 0, then no retries will be done.'
          type: integer
        retries-per-endpoint:
          description: 'Specifies the number of retries against the current endpoint of the MI.SourceExtended object for a given class of error. Values: A value of greater than equal to 0 indicating the number of retries. Example: If the value of retries-per-endpoint of the retries property of connection-setup-timeout-ms-actions is set to 5, then 5 retries will be done for connection-setup timeout errors on the current endpoint of the current MI.SourceExtended object. If this value is set to 0, then no retries will be done.'
          type: integer
    MI_HTTPCodeFailover:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.HTTPCodeFailover'
    MI.HTTPCodeFailover:
      type: object
      description: 'HttpCodeFailover is a new GenericMetadata subobject of SourceExtended that allows for the dCDN to specify how it will handle error HTTP codes against the origin/uCDN.'
      required:
        - http-code-failover-actions
      properties:
        max-reforwards-per-source:
          description: 'Specifies the upper bound of reforwards allowed across all endpoints of a MI.SourceExtended object for all configured HTTP error codes. A value greater than or equal to 0 indicating the maximum number of retries against all endpoints of the current MI.SourceExtended object for all configured HTTP error codes.'
          type: integer
        http-code-failover-actions:
          description: 'Specifies the different HTTP codes for which failover actions against the Origin/uCDN must be done.'
          $ref: '#/components/schemas/MI_HTTPCodeFailoverActions'
    MI_HTTPCodeFailoverActions:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.HTTPCodeFailoverActions'
    MI.HTTPCodeFailoverActions:
      type: object
      description: 'HttpCodeFailoverActions is a subobject of HttpCodeFailover. It defines one or more error HTTP codes against which some failover action must be performed.'
      required:
        - reforwards
        - http-codes
      properties:
        http-codes:
          description: 'Specifies the list of error HTTP codes received from Origin/uCDN for which a failover must be performed. The value is an array of error (4xx and above) HTTP codes.'
          type: array
          items:
            type: string
        reforwards:
          description: 'Specifies how the reforwards must be done.'
          $ref: '#/components/schemas/MI_HTTPCodeReforwards'
        error-state:
          description: 'Specifies whether to capture any error message for the current error condition.'
          $ref: '#/components/schemas/MI_SetVariable'
    MI_HTTPCodeReforwards:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.HTTPCodeReforwards'
    MI.HTTPCodeReforwards:
      type: object
      description: 'HttpCodeReforwards is a subobject of MI.HttpCodeFailoverActions that allows for specifying the reforwards that must happen against endpoints of a MI.SourceExtended object.'
      properties:
        max-reforwards-per-source:
          description: 'Specifies the maximum number of reforwards that can be performed across all endpoints of the MI.SourceExtended object for a given set of error HTTP codes. A value greater than or equal to 0 indicates the maximum number of reforwards against a MI.SourceExtended object. A value of 0 indicates that no reforwards will be done against this source for the given set of error HTTP codes.'
          type: integer
        reforwards-per-endpoint:
          description: 'Specifies the number of reforwards to be performed across the current endpoint of the MI.SourceExtended object for a given set of error HTTP codes. A value of greater than or equal to 0 indicates the number of reforwards against the current endpoint. A value of 0 indicates that no reforwards will be performed against the current endpoint for the given set of error HTTP codes.'
          type: integer
          default: 0
    MI_LoadBalanceMetadata:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.LoadBalanceMetadata'
    MI.LoadBalanceMetadata:
      type: object
      description: 'Defines how content acquisition requests are distributed over the SourceExtended objects listed in the SourceMetadataExtended object.'
      properties:
        balance-algorithm:
          description: 'This property specifies the algorithm to be used when distributing content acquisition requests over the sources in a SourceMetadataExtended object. The available algorithms are: round-robin, content-hash, and ip-hash. round-robin: Requests are distributed over the sources in proportion to their associated weights. content-hash: Requests are distributed over the sources in a consistent fashion, based on the balance-path-pattern property.ip-hash: Requests are distributed over the sources in a consistent fashion based on the IP address of the client requestor.'
          type: string
          enum: [round-robin, content-hash, ip-hash]
        balance-weights:
          description:  This property specifies the relative frequency that a source is used when distributing requests. For example, if there are three SourceExtended objects in a SourceMetadataExtended object with balance-weights [1, 2, 1], source 1 will receive 1/4 of the requests; source 2 will receive 2/4 of the requests; source 3 will receive 1/4 of the requests.
          type: array
          items:
            type: integer
        balance-path-pattern:
          description: 'This property specifies a regular expression pattern to apply to the URI when calculating the content hash used by the balance-algorithm. For example, "balance-path-pattern":"^/prod/(.*)/.*\.ts$" would distribute requests based on the URI but excluding the prod prefix and the .ts segment file.'
          type: string
    MI_StaleContentCachePolicy:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.StaleContentCachePolicy'
    MI.StaleContentCachePolicy:
      type: object
      description: 'Allows the uCDN to specify the policy to use by a dCDN when responding with stale (expired) content.'
      properties: 
        stale-while-revalidating:
          description: 'This property is used to instruct the dCDN to serve a stale version of a resource while refreshing the resource with the uCDN. When set to True, the dCDN will return a previously cached version of a resource while the resource is refreshed with the uCDN in the background. The default is False, which waits for the uCDN to refresh a resource before responding to the client.'
          type: boolean
          default: false
        stale-if-error:
          description: 'Instructs the dCDN to serve a stale version of a resource if any one of a specified set of HTTP status codes was received when trying to refresh the resource with the uCDN.  In this case, the dCDN will return a previously cached version of a resource instead of caching the error response. While this capability is typically used for well-understood HTTP error status codes, a list of any HTTP codes can be provided for maximum flexibility. The default is to not serve stale content.  An empty or unspecified list may function as a means to revoke a list inherited from an upper level configuration If specified, the  stale-if-error list must not be empty.'
          type: array 
          items:
            type: string
            description: Any HTTP status code from 100 to 599, or one of the special values  “4xx” or “5xx”, where “xx” implies everything from 00 to 99.
        failed-revalidation-delta-seconds:
          description: 'Drives the dCDN behavior when revalidation attempts to the uCDN fail, specifying the number of seconds to wait before making another attempt to revalidate the resource with the uCDN. Use of failed-revalidation-delta-seconds allows load to be reduced on the uCDN during times of system stress. Stale content is served during this wait period.'
          type: integer
          default: 0
      example:
        value: {
                "stale-while-revalidating": “true”, 
                “stale-if-error”: [“404”, “503”, “504” ],
                “failed-refresh-ttl”: 5
              }
    MI_TrafficType:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.TrafficType'
    MI.TrafficType:
      type: object
      description: 'Defines a set of descriptors that characterize either the type or usage of the traffic, enabling CDNs and OCNs to apply any internal configuration rules without exposing an unnecessary amount of internal details.'
      required:
        - traffic-type
      properties:
        traffic-type:
          description: 'A literal that defines the traffic type. uCDN will use the literal that is most representative of the traffic being delegated. The following literals are specified: vod, live, object-download.'
          type: string
          enum: [vod, live, object-download]
        hints:
          description: 'Other traffic characteristics that uCDN can indicate to the dCDN as suggestions for service optimization. Accepts free-form unconstrained values.'
          type: array 
          items:
            type: string
      example:
        value: {
                "traffic-type": "vod",
                "hints": [ "low-latency", "catch-up" ]
                }
    MI_MediaServiceDescription:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.MediaServiceDescription'
    MI.MediaServiceDescription:
      type: object
      description: 'MI.MediaServiceDescription metadata defines a set of descriptors associated with a media service delegated to the dCDN. This metadata can be used by the CDN or OCN provider to implement specific strategies that will maximize performance. Note that these strategies are implementation specific and not specified by SVTA. For instance,  by knowing the location of the manifest, the dCDN is able to implement some segment prefetching strategies. Further, indicating the notion of media service allows the CDN or OCN provider to track and monitor streaming sessions in a more comprehensive manner.'
      properties:
        manifestURL:
          description: 'Path of the manifest (mpd or m3u8) file related to this media service.'
          type: string
        mediaServiceName:
          description: 'String describing or identifying the media service.'
          type: string 
      example:
        value: {
            "manifestURL": "/live/channelXYZ/index.mpd",
            "mediaServiceName": "ChannelXYZ",
            }
    MI_SetVariable:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.SetVariable'
    MI.SetVariable:
        type: object
        description: 'Allows to set user-defined variables that can be accessed from the Metadata Expression Language.'
        required:
          - variable-name
          - variable-value
        properties:
          variable-name:
            description: 'Name of the variable to be set. The value of the variable-name is an alphanumeric string with both upper and lower case and must start with an alphabet.'
            type: string
          variable-value:
            description: 'Specifies the string value to set for the user-defined variable.'
            type: string
          value-is-expression:
            description: 'Flag to signal whether the value is a static string literal or a [CDNI-MEL] expression that needs to be dynamically evaluated.'
            type: boolean
            default: false
    MI_LocationACLExtended:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.LocationACLExtended'
    MI.LocationACLExtended:
        type: object
        description: 'MI.LocationAclExtended is an alternative to the CDNI standard MI.LocationAcl object that defines which locations a User Agent needs to be in, in order to be able to receive the associated content. MI.LocationAclExtended uses ACL rules of type MI.LocationRuleExtended, providing rules for handling denied requests. This object conforms to the specification defined for the behavior of MI.LocationAcl and the two are mutually exclusive.'
        required:
          - rules
        properties:
          rules:
            description: 'An array of MI.LocationRuleExtended objects.'
            type: array
            items:
              $ref: '#/components/schemas/MI_LocationRuleExtended'
    MI_LocationRuleExtended:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.LocationRuleExtended'
    MI.LocationRuleExtended:
        type: object
        description: ''
        required:
          - locations
        properties:
          locations:
            description: 'An array of footprints to match against. These footprints, defined by pairs of MI_footprinttype_ex and 	MI_footprintvalue_ex respectively extend the CDNI MI_footprinttype and MI_footprintvalue. On top of the 4 footprint types defined by CDNI in rfc8006 [ipv4cidr,ipv6cidr,asn,countrycode], 3 new types are added: [ipv4range, ipv6range, subdivisioncode]'
            type: array
            items:
              type: string
              enum: [ipv4cidr, ipv6cidr, asn, countrycode, ipv4range, ipv6range, subdivisioncode]
          action:
            description: 'The action to take place upon location match'
            type: string
            enum: [allow, deny]
            default: deny
          comment:
            description: 'An optional text comment for user readability and for  incorporating in logging '
            type: string
          deny-response:
            description: 'configuration of the 	entire response to the client in case of deny action.'
            $ref: '#/components/schemas/MI_SyntheticResponse'
            default: { "response-status" : "403" }
          match-all-locations:
            description: 'The ACL rule match will take place 	only if all locations In the rule are matched, e.g both asn and subdivisioncode'
            type: boolean
            default: false
    MI_TimeWindowAclExtended:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.TimeWindowAclExtended'
    MI.TimeWindowAclExtended:
        type: object
        description: 'MI.TimeWindowAclExtended is an alternative to the CDNI standard MI.TimeWindow object for implementing time-based access restrictions. It uses ACL rules of type MI.TimeWindowRuleExtended to provide rules for handling denied requests. This object conforms to the specification defined for the behavior of MI.TimeWindowAcl and the two are mutually exclusive'
        required:
          - rules
        properties:
          rules:
            description: 'An array of MI.TimeWindowRuleExtended objects.'
            type: array
            items:
              $ref: '#/components/schemas/MI_TimeWindowRuleExtended'
    MI_TimeWindowRuleExtended:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.TimeWindowRuleExtended'
    MI.TimeWindowRuleExtended:
        type: object
        description: ''
        required:
          - windows
        properties:
          windows:
            description: 'An array of MI.TimeWindow objects to match against'
            type: array
            items:
              $ref: '#/components/schemas/MI_TimeWindow'
          action:
            description: 'The action to take place upon time window match'
            type: string
            enum: [allow, deny]
            default: deny
          comment:
            description: 'An optional text comment for user readability and for  incorporating in logging '
            type: string
          deny-response:
            description: 'configuration of the 	entire response to the client in case of deny action.'
            $ref: '#/components/schemas/MI_SyntheticResponse'
            default: { "response-status" : "403" }
    MI_CertificateMetadata:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.CertificateMetadata'
    MI.CertificateMetadata:
        type: object
        description: 'To allow for secure delivery of content, a dCDN must be configured to support HTTPs.  The MI.CertificateMetadata object is used to configure the dCDN’s HTTPs attributes such as TLS certificate credentials, encryption levels, protocols, and ciphers.'
        required:
          - encryption-level
          - delegated-credentials
        properties:
          encryption-level:
            description: 'A reference to a MI.EncryptionLevelMetadata object that specifies the TLS protocols and ciphers to use.'
            $ref: '#/components/schemas/MI_EncryptionLevelMetadata'
          delegated-credentials:
            description: 'A reference to the certificate delegated credentials to use when establishing a TLS session with the client.'
            $ref: '#/components/schemas/MI_CertificateCredentialsMetadata'
          ocsp-enabled:
            description: 'When ocsp-enabled is set to True, the dCDN will check the revocation status of the configured certificate and include that information with the  response to the client.  See https://datatracker.ietf.org/doc/html/rfc6066#section-8'
            type: boolean
            default: false
          prefer-server-ciphers:
            description: 'When prefer-server-ciphers is set to False (the default), the dCDN will prefer to use cipher suites in the order presented by the client when negotiating the TLS handshake.   When prefer-server-ciphers is set to True, cipher suites will be selected in the order preferred by the dCDN server.'
            type: boolean
            default: false
    MI_EncryptionLevelMetadata:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.EncryptionLevelMetadata'
    MI.EncryptionLevelMetadata:
        type: object
        description: 'MI.EncryptionLevelMetadata is a subobject of MI.CertificateMetadata to support HTTPs content delivery.  MI.EncryptionLevelMetadata specifies the protocols and ciphers to be used by the associated MI.CertificateMetadata object.  Externalizing MI.EncryptionLevelMetadata from MI.CertificateMetadata allows security policy (TLS protocols and ciphers) to be defined once and referenced by many configurations.'
        required:
          - encryption-level-name
          - protocols
          - ciphers
        properties:
          encryption-level-name:
            description: 'A descriptive name for the MI.EncryptionLevelMetadata object.  This name is expected to be used by operators to reference the MI.EncryptionLevelMetadata configuration.'
            type: string
          protocols:
            description: 'An array that lists the allowed protocols for the TLS session.'
            type: array
            items:
              type: string
              enum: [TLSv1.0,TLSv1.1,TLSv1.2,TLSv1.3,SSLv3]
          ciphers:
            description: 'An array that lists the allowed ciphers for the TLS session.'
            type: array
            items:
              type: string
    MI_CertificateCredentialsMetadata:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.CertificateCredentialsMetadata'
    MI.CertificateCredentialsMetadata:
        type: object
        description: 'MI.CertificateCredentialsMetadata is a subobject of MI.CertificateMetadata  that defines the credentials to use when establishing a TLS session between a dCDN and client.'
        required:
          - delegated-credentials-type
          - delegated-credentials-value
        properties:
          delegated-credentials-type:
            description: 'DelegatedCredentials type (The CDNI Payload Type [RFC7736]  of the GenericMetadata object contained in the delegated-credentials-value property).'
            type: string
          delegated-credentials-value:
            description: 'An object conforming to the specification associated with the DelegatedCredentials type.'
            $ref: '#/components/schemas/MI_GenericMetadata'
    MI_ClientAuthMetadata:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.ClientAuthMetadata'
    MI.ClientAuthMetadata:
        type: object
        description: 'The MI.ClientAuthMetadata defines how a dCDN authenticates client requests.'
        required:
          - delivery-auth
        properties:
          delivery-auth:
            description: 'Authentication method to use when granting access to a resource requested by a client.'
            $ref: '#/components/schemas/MI_Auth'
# CI (Control) interface (RFC 8007) 
# Regsitered CI payload types in IANA: https://www.iana.org/assignments/cdni-parameters/cdni-parameters.xhtml
    ci-trigger-command:
      type: object
      required:
        - cdn-path 
      properties:
        cdn-path:
          $ref: '#/components/schemas/CI_cdn-path'
          description: 'The CDN PIDs of CDNs that have already issued the CI/T Command to their dCDNs'
        cancel:
          $ref: '#/components/schemas/CI_cancel'
          description: 'The URLs of Trigger Status Resources for CI/T Trigger Commands that the uCDN wants to cancel'
        trigger:
          $ref: '#/components/schemas/CI_trigger'
          description: 'A specification of the trigger type and a set of data to act upon'
    ci-trigger-status:
      type: object
      description: 'Trigger Status Resource created by the dCDN once processing a ci-trigger-Command'
      required:
        - trigger
        - ctime
        - mtime 
        - status
      properties:
        trigger:
          $ref: '#/components/schemas/CI_trigger'
          description: 'The Trigger Specification posted in the body of the CI/T Command. Note that this need not be a byte-for-byte copy. For example, in the JSON representation the dCDN may re-serialize the information differently.'
        ctime:
          $ref: '#/components/schemas/CI_time'
          description: 'Time at which the CI/T Command was received by the dCDN. Time is determined by the dCDN; there is no requirement to synchronize clocks between interconnected CDNs'
        mtime:
          $ref: '#/components/schemas/CI_time'
          description: 'Time at which the Trigger Status Resource was last modified. Time is determined by the dCDN; there is no requirement to synchronize clocks between interconnected CDNs' 
        etime:
          $ref: '#/components/schemas/CI_time'
          description: 'Estimate of the time at which the dCDN expects to complete the activity. Time is determined by the dCDN; there is no requirement to synchronize clocks between interconnected CDNs'
        status:
          $ref: '#/components/schemas/CI_status'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/CI_error'
    CI_status:
      type: string
      enum: [pending, active, complete, processed, failed, canceling, canceled]
    CI_error:
      type: object
      required:
        - error
      description: 'Metadata and content references copied from the Trigger Specification.  Only those URLs and patterns to which the error applies are included in each property, but those URLs and patterns MUST be exactly as they appear in the request; the dCDN MUST NOT generalize the URLs. For example, if the uCDN requests pre-positioning of URLs "https://content.example.com/a" and "https://content.example.com/b", the dCDN must not generalize its error report to the pattern "https://content.example.com/*".)'
      properties:
        error:
          type: string
          enum: [emeta, econtent, eperm, ereject, ecdn, ecanceled, eunsupported]
        metadata.urls:
          $ref: '#/components/schemas/CI_urls'
          description: 'Copied from the CI_trigger related request/command concerned by the error'
        content.urls:
          $ref: '#/components/schemas/CI_urls'
          description: 'Copied from the CI_trigger related request/command concerned by the error'
        metadata.patterns:
          $ref: '#/components/schemas/CI_patterns'
          description: 'The metadata the trigger applies to'
        content.patterns:
          $ref: '#/components/schemas/CI_patterns'
          description: 'The content the trigger applies to'
        description:
          type: string
          description: 'A human-readable description of the error'
    CI_cdn-path:
      type: array
      items:
        type: string
    CI_cancel:
       type: array
       items:
          type: string
    CI_patterns:
      type: array
      items:
        type: object
        properties:
          pattern:
            type: string
          case-sensitive:
              type: boolean
              default: false
          match-query-string:
            type: boolean
            default: false
            description: 'Flag indicating whether to include the query part of the URI when comparing against the pattern.'    
    CI_urls:
      type: array
      items:
        type: string
      description: 'The URLs of content the CI Trigger Command applies to.'
    CI_trigger:
        type: object
        required:
          - type
        properties:
          type:
            type: string
            enum: [preposition, invalidate, purge]
          metadata.urls:
            $ref: '#/components/schemas/CI_urls'
            description: 'The uCDN URLs of the metadata the CI/T Trigger Command applies to. At least metadata.urls or content.urls must be present'
          content.urls:
            $ref: '#/components/schemas/CI_urls'
            description: 'The URLs of content the CI/T Trigger Command applies to. At least metadata.urls or content.urls must be present'
          content.ccid:
            type: array
            items:
              type: string
            description: 'The Content Collection IDentifier of content the trigger applies to. The "ccid" is a grouping of content, as defined by [RFC8006]'
          metadata.patterns:
            $ref: '#/components/schemas/CI_patterns'
            description: 'The metadata the trigger applies to. Not allowed with the "preposition" trigger'
          content.patterns:
            $ref: '#/components/schemas/CI_patterns'
            description: 'The content the trigger applies to. Not allowed with the "preposition" trigger'
    CI_time:
      type: number
      description: A JSON number, seconds since the UNIX epoch (00:00:00 UTC on 1 January 1970)
 