openapi: 3.0.1
info:
  title: Open Caching API - CONfiguration Interface (COI) 
  description: 'This is the Open Caching API model as exposed by an ISP( dCDN) according to the Streaming Video Technology Alliance (SVTA).'
  contact:
    email: guillaume.bichot@broadpeak.tv
  version: 2.0.0
externalDocs:
    description: Find out more
    url: 'https://opencaching.svta.org/'
security: 
  - bearerToken: []
paths:
  /OC/CI/configuration:
    put:
      tags:
        - OC_COI_simple
      summary: Communicates the metadata/configuration (RFC8006 + RFC8804) to the ISP with a simple API.
      description: 'To be used when the metadata to communicate is pseudo static and simple. The ISP (dCDN) processes the request and answers immediately. For more complex metadata use the CI API.'
      operationId: OC_CI_configure
      requestBody:
        description: 'The metadata(configuration) to be considered/processed by the ISP According to SVA OpenCaching specification and CDNI RFCs 8006/8804. It is the entire dataset (HostIndex).'
        content:
          application/cdni;ptype=MI.HostIndex:
            schema:
              $ref: '#/components/schemas/MI.HostIndex'
        required: true
      responses:
        202:
          description: 'The 202 status code is an interim response used to inform the client that the server has accepted the complete request, but has not yet completed it. This status code SHOULD only be sent when the server has a reasonable expectation that the request will take significant time to complete'
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                description: 'The status is pending. The status report gathers the URL of the metadata configuration file(s) currently under processing. The response gathers in the Location header the triggerID URL to be used with the GET OC/CI/status/{TriggerID} in order for the uCDN to check the completion of the configuration'
                $ref: '#/components/schemas/ci-trigger-status'
        200:
          description: The configuration file has been modified.
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                description: 'The status is complete. The status report gathers the URL of the activated metadata configuration file.'
                $ref: '#/components/schemas/ci-trigger-status'
        201:
          description: The configuration file has been created.
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                description: 'The status is complete. The status report gathers the URL of the activated metadata configuration file.'
                $ref: '#/components/schemas/ci-trigger-status'
        400:
          description: 'Command is invalid. The status report gathers the URL of the faulty metadata configuration file. The URL corresponds to the configuration file modified: Invalid metadata objects are marked with the properties safe-to-redistribute set to "false" and incomprehensible set to "true". Note that the status report is not kept by the dCDN.'
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                description: 'The status is "Failed".'
                $ref: '#/components/schemas/ci-trigger-status'
        403:
          description: Forbidden.
        404:
          description: Not found.
        500:
          description: "server error"
    get:
      tags:
        - OC_COI_simple
      summary: 'Gets the whole metadata configuration (RFC 8006)'
      description: 'This API is exposed by the dCDN and is used by the uCDN to retrieve the whole valid configuration file. It does not contain any metadata object references.'
      operationId: OC_CI_getConfiguration
      responses:
        200:
          description: 'Active configuration metadata.'
          content:
            application/cdni;ptype=MI.HostIndex:
              schema:
                $ref: '#/components/schemas/MI.HostIndex'
        400:
          description: Command is invalid.
          content: {}
        403:
          description: Forbidden.
          content: {}     
        404:
          description: Not found.
          content: {}  
    delete:
      tags:
        - OC_COI_simple
      summary: 'Deletes the whole configuration.'
      operationId: OC_CI_deleteConfiguration
      responses:
        200:
          description: 'Prepositioned configuration metadata is deleted/purged. This does cancel/stop the corresponding delegation.'
          content: {}
        400:
          description: Command is invalid.
          content: {}
        403:
          description: Forbidden.
          content: {} 
        404:
          description: Not found.
          content: {}  
  /OC/CI/configuration/{host}:
    put:
      tags:
        - OC_COI_simple_host
      summary: Communicates part of the metadata/configuration (RFC8006 + RFC8804) to the ISP with a simple API.
      description: 'To be used when the metadata to communicate is pseudo static and simple. The ISP (dCDN) processes the request and answers immediately. For a more complex metadata then use the CI API.'
      operationId: OC_CI_configure_host
      parameters:
        - name: host
          in: path
          required: true
          description: 'Parameter to create/update the configuration related to a host. "www.disney.com" allows to create or modify the configuration associated with that host name.'
          schema:
            type: string
      requestBody:
        description: 'The metadata(configuration) to be considered/processed by the ISP According to SVA OpenCaching specification and CDNI RFCs 8006/8804. It is the metadata associated with a host name. the MI.HostMetadata object must be provided.'
        content:
          application/cdni;ptype=MI.HostMetadata:
            schema:
              $ref: '#/components/schemas/MI.HostMetadata'
        required: true
      responses:
        200:
          description: The configuration metadata part associated with the Host entry has been modified successfully.
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                description: 'The status is complete. The status report gathers the URL of the activated metadata configuration file.'
                $ref: '#/components/schemas/ci-trigger-status'
        201:
          description: The configuration metadata file has been successfully updated, creating a new Host entry.
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                description: 'The status is complete. The status report gathers the URL of the activated metadata configuration part.'
                $ref: '#/components/schemas/ci-trigger-status'
        202:
          description: 'The 202 (Processing) status code is an interim response used to inform the client that the server has accepted the complete request, but has not yet completed it. This status code SHOULD only be sent when the server has a reasonable expectation that the request will take significant time to complete. The reponse gathers in the Location header the triggerID URL to be used with the GET OC/CI/status/{TriggerID} in order for the uCDN to check the completion of the configuration.'
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                description: 'The status is pending. The status report gathers the URL of the metadata configuration file(s) currenly under processing.'
                $ref: '#/components/schemas/ci-trigger-status'
        400:
          description: 'Command is invalid. The status report gathers the URL of the faulty metadata configuration part. The URL corresponds to the request body part (MI.HostMetadata) modified: Invalid metadata objects are marked with the properties safe-to-redistribute set to "false" and incomprehensible set to "true". Note that the status report is not kept by the dCDN.'
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                description: 'The status is "Failed".'
                $ref: '#/components/schemas/ci-trigger-status'
        403:
          description: Forbidden.
        404:
          description: 'Not found. There was no configuration file.' 
        500:
          description: "server error"
    get:
      tags:
        - OC_COI_simple_host
      summary: 'Gets part of the metadata configuration (RFC 8006)'
      description: 'This API is exposed by the dCDN and is used by the uCDN to retrieve the valid configuration associated with a host name. It does not contain any metadata object references.'
      operationId: OC_CI_getConfiguration_host
      parameters:
        - name: host
          in: path
          required: true
          description: 'Parameter to get the configuration related to a host. "www.disney.com" allows to get the configuration associated with that host name.'
          schema:
            type: string
      responses:
        200:
          description: 'Prepositioned configuration metadata. The MI.HostMetadata object is returned.'
          content:
            application/cdni;ptype=MI.HostMetadata:
              schema:
                $ref: '#/components/schemas/MI.HostMetadata'
        400:
          description: Command is invalid.
          content: {}
        403:
          description: Forbidden.
          content: {}  
        404:
          description: Not found.
          content: {}
    delete:
      tags:
        - OC_COI_simple_host
      summary: 'Deletes part of the configuration related to a host name.'
      operationId: OC_CI_deleteConfiguration_host
      parameters:
        - name: host
          in: path
          description: 'Parameter to delete the configuration related to a host. "www.disney.com" allows to delete the configuration associated with that host name.'
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Part of the prepositioned configuration metadata, according to the host parameter, is deleted/purged. This does cancel/stop the corresponding delegation.'
          content: {}
        400:
          description: Command is invalid.
          content: {}
        403:
          description: Forbidden.
          content: {} 
        404:
          description: Not found.
          content: {}
  /OC/CI/configuration/{host}/{pathPattern}:
    put:
      tags:
        - OC_COI_simple_pathPattern
      summary: Communicates the metadata/configuration (RFC8006 + RFC88004) to the ISP with a simple API
      description: 'To be used when the metadata to communicate is pseudo static and simple. The ISP (dCDN) processes the request and answers immediately. For a more complex metadata then use the CI API.'
      operationId: OC_CI_configure_host_pathPattern
      parameters:
        - name: host
          in: path
          description: 'Parameter indicating the host ("www.disney.com")'
          required: true
          schema:
            type: string
        - name: pathPattern
          in: path
          description: 'Parameter to update the configuration related to a host AND a path pattern (e.g. the path pattern  "/live/*" associated with the host "www.disney.com").'
          required: true
          schema:
            type: string
            format: URL
      requestBody:
        description: 'The metadata(configuration) to be considered/processed by the ISP According to SVA OpenCaching specification and CDNi RFCs 8006/8804. It is a part of it according to the host and pathPattern parameters. The MI.PathMetadata object is provided.'
        content:
          application/cdni;ptype=MI.PathMetadata:
            schema:
              $ref: '#/components/schemas/MI.PathMetadata'
        required: true
      responses:
        200:
          description: The configuration file has been modified successfully.
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                description: 'The status is complete. The status report gathers the URL of the activated metadata configuration file.'
                $ref: '#/components/schemas/ci-trigger-status'
        201:
          description: The configuration metadata file has been successfully updated, creating a new path metadata entry.
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                description: 'The status is complete. The status report gathers the URL of the activated metadata configuration part.'
                $ref: '#/components/schemas/ci-trigger-status'
        202:
          description: 'The 102 (Processing) status code is an interim response used to inform the client that the server has accepted the complete request, but has not yet completed it. This status code SHOULD only be sent when the server has a reasonable expectation that the request will take significant time to complete. The reponse gathers in the Location header the triggerID URL to be used with the GET OC/CI/status/{TriggerID} in order for the uCDN to check the completion of the configuration'
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                description: 'The status is pending. The status report gathers the URL of the metadata configuration file(s) currenly under processing.'
                $ref: '#/components/schemas/ci-trigger-status'
        400:
          description: 'Command is invalid. The status report gathers the URL of the faulty metadata configuration part. The URL corresponds to the request body part (MI.PathMetadata) modified: Invalid metadata objects are marked with the properties safe-to-redistribute set to "false" and incomprehensible set to "true". Note that the status report is not kept by the dCDN.'
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                description: 'The status is "Failed"'
                $ref: '#/components/schemas/ci-trigger-status'
        403:
          description: 'Forbidden.'
        404:
          description: 'Not found.'
        500:
          description: "server error"
    get:
      tags:
        - OC_COI_simple_pathPattern
      summary: 'Gets part of the metadata configuration (RFC 8006) associated with a path pattern.'
      description: 'This API is exposed by the dCDN and is used by the uCDN to retrieve a valid configuration subset. It does not contain any metadata object references.'
      operationId: OC_CI_getConfiguration_pathPattern
      parameters:
        - name: host
          in: path
          description: 'Parameter to get the configuration related to a host.'
          required: true
          schema:
            type: string
        - name: pathPattern
          in: path
          description: 'Parameter to get the configuration related to a host AND a path pattern GET  /OC/CI/configuration/www.disney.com/live/*" to get metadata associated with that path pattern. The MI.PathMetadata object is returned.'
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Part of the prepositioned configuration metadata according to the host and pathPattern parameters'
          content:
            application/cdni;ptype=MI.PathMetadata:
              schema:
                $ref: '#/components/schemas/MI.PathMetadata'
        400:
          description: Command is invalid.
          content: {}
        403:
          description: Forbidden.
          content: {}     
        404:
          description: Not found.
          content: {}  
    delete:
      tags:
        - OC_COI_simple_pathPattern
      summary: 'Deletes part of the configuration associated with a host name AND a path pattern'
      operationId: OC_CI_deleteConfiguration_pathPattern
      parameters:
        - name: host
          in: path
          description: 'Parameter to indicate the host.'
          required: true
          schema:
            type: string
        - name: pathPattern
          in: path
          description: 'Parameter to delete the configuration related to a host AND a path pattern.'
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Part of the prepositioned configuration metadata, according to the host and the pathPattern parameters, is deleted/purged. This does cancel/stop the corresponding delegation.'
          content: {}
        400:
          description: Command is invalid.
          content: {}
        403:
          description: Forbidden.
          content: {} 
        404:
          description: Not found.
          content: {}  
  /OC/CI/subscription:
    post:
      tags:
        - OC_COI_notif
      summary: 'Subscribes to OCI status update notifications.'
      operationId: oc_oci_post_subscribe
      description: 'A subscription ID is returned in the Location header of the response in case of successful creation.'
      requestBody:
        description: ''
        content:
          application/cdni:
            schema:
              type: object
              required:
                - notificationOciTarget
              properties:
                notificationOciTarget:
                  type: string
                notificationType:
                  type: string
                  enum: [status]
        required: true
      callbacks:
        OciNotification:
          '{$request.body#/notificationOciTarget}':
            put:
              summary: 'The ISP OC/dCDN to post an OCI configuration status update.'
              description: 'This callback is used by the ISP OC/dCDN to put an OCI configuration status update.'
              tags:
                - OC_COI_notif
              operationId: oc_oci_push_notification
              requestBody:
                description: 'Callback payload.'
                content: 
                  'application/cdni;ptype=ci-trigger-status':
                    schema:
                      $ref: '#/components/schemas/ci-trigger-status'
              responses:
                '200':
                  description: 'Configuration status updated.'
                '400':
                  description: 'Bad request.'
                '403':
                  description: 'Forbidden.'
      responses:
        201:
          description: 'Subscription created. The "Location" header gathers the subscription ID (the URI) of the newly created resource.'
        400:
          description: 'Bad request.'
        403:
          description: 'Forbidden.'
        404:
          description: 'No such API.' 
  /OC/CI/subscription/{subscriptionId}:
    get:
      tags:
        - OC_COI_notif
      summary: get the OCI notification subscription 
      operationId: oc_oci_get_notificationSubscription
      description: ''
      parameters:
        - name: subscriptionId
          in: path
          required: true
          description: 'Identifier of the subscription resource. This parameter is returned when creating the subscription.'
          schema:
            type: string
      responses:
        200:
          description: 'OCI notification subscription.'
          content:
            application/cdni:
              schema:
                type: object
                required:
                  - notificationOciTarget
                properties:
                  notificationOciTarget:
                   type: string
                  notificationType:
                    type: string
                    enum: [status]
        400:
          description: 'Bad request'
        403:
          description: 'Forbidden'
        404:
          description: 'Not found'
    delete:
      tags:
        - OC_COI_notif
      summary: 'delete the notification subscription'
      operationId: OC_oci_delete_notificationSubscription
      parameters:
        - name: subscriptionId
          in: path
          required: true
          description: 'Identifier of the subscription resource. This parameter is returned when creating the subscription.'
          schema:
            type: string 
      responses:
        200:
          description: 'Notification subscription deleted'
          content: {}
        400:
          description: Command is invalid
          content: {}
        403:
          description: Forbidden
          content: {}    
        404:
          description: 'Not found' 
  /OC/CI/trigger:
    post:
      tags:
        - OC_OCI_trigger
      summary: Communicates the metadata, configuration and/or content to the ISP with the CI/trigger API (RFC 8007).
      description: 'According to SVA OpenCaching specification and RFC 8007 for the Trigger protocol and RFC 8006 (+ RFC8804) for the metadata structure.'
      operationId: OC_CI_provision
      requestBody:
        description: The metadataset or a link to the set to be considered/processed by the ISP.
        content:
          application/cdni;ptype=ci-trigger-command:
            schema:
              description: 'For triggering the creation of a trigger command for metadata or content pre-positioning. The URL(s) present in the ci-trigger-commnd metadata.urls property should conform to the callbacks format (see below).'
              $ref: '#/components/schemas/ci-trigger-command'
        required: true
      callbacks:
        requestMetadata:
          /OC/CI/metadata/{pathName}:
            get:
              summary: ''
              description: 'This callback is used by the ISP OC/dCDN to retrieve the metadata/configuration elements referenced in the ci-trigger-command object and potentially generic metadata object (metadata_urls property) as specified in RFC8006/RFC8007.'
              tags:
              - OC_OCI_MI
              operationId: oc_mi_get_metadata
              parameters:
                - name: pathName
                  in: path
                  description: 'The calbback url has a FQDN part followed by the mandatory "OC/MI/metadata/" followed by a path suffix associated with the metadata object to be retrieved according to the MI API.'
                  required: true
                  schema:
                    type: string
                    format: uri
              responses:
                200:
                  description: 'Returns the requested metadata object.'
                  content:
                    application/cdni:
                      schema:
                        $ref: '#/components/schemas/MI.HostIndex'
                404:
                  description: Not found
                  content: {}
        requestContent:
          /OC/CMI/content/{pathName}:
            get:
              summary: ''
              description: 'This callback is used by the ISP OC/dCDN to retrieve the content elements referenced in the ci-trigger-command.'
              tags:
              - OC_OCI_CO
              operationId: oc_ci_get_content
              parameters:
                - name: pathName
                  in: path
                  description: 'The calbback url has a fqdn part followed by the mandatory "OC/CMI/content" followed by a path sufixe associated with the content object to be retrieved according to the MI API.'
                  required: true
                  schema:
                    type: string
                    format: uri
              responses:
                200:
                  description: 'Returns the requested content (either a file or a playlist gathering the list of files to pre-position).'
                  content:
                    text/plain:
                      schema:
                        type: string
                        format: binary
                404:
                  description: Not found.
                  content: {}
      responses:
        201:
          description: Created.
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                $ref: '#/components/schemas/ci-trigger-status' 
          links:
            getTriggerId:
              operationId: OC_CI_status
              parameters:
                triggerId: '$response.header.Location'
                description: 'The value returned in the "Location" header of the HTTP response is the URL to be used with "GET /OC/CI/status/{triggerId}".'
        400:
          description: Command is invalid.
          content: {}
        403:
          description: Forbidden.
          content: {}
  /OC/CI/status/{triggerId}:
    get: 
      summary: 'Check the CI trigger status.'
      description: 'According to SVA OpenCaching specification and RFC 8007 for the Trigger protcool and RFC 8006.'
      tags:
        - OC_OCI_trigger
      operationId: OC_CI_status
      parameters:
        - in: path
          name: triggerId
          description: 'The triggerId parameter corresponds to the "Location" header as part of the response corresponding to the PUT /OC/CI/configuration API and the POST OC/CI/trigger API.'
          required: true
          schema:
            type: string
            format: url
      responses:
        200:
          description: 'Preposioning metatdata/configuration or content status.'
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                $ref: '#/components/schemas/ci-trigger-status'
        304:
          description: 'not modified.'
          content: {}
        400:
          description: Command is invalid.
          content: {}
        403:
          description: Forbidden.
          content: {} 
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
# FCI objects
    FCI_COI_capabilitytype:
      oneOf:
        - type: string
          enum: [FCI.MetadataExtended]
        - $ref: './SVTA_OC_openAPI_COI_2a.yaml#/components/schemas/FCI_COI2a_capabilitytype'
        - $ref: './SVTA_OC_openAPI_COI_2g.yaml#/components/schemas/FCI_COI2g_capabilitytype'
        - $ref: './SVTA_OC_openAPI_COI_2h.yaml#/components/schemas/FCI_COI2h_capabilitytype'
        - $ref: './SVTA_OC_openAPI_COI_2i.yaml#/components/schemas/FCI_COI2i_capabilitytype'
    FCI_COI_capabilityvalue:
      oneOf:
        - $ref: '#/components/schemas/FCI.MetadataExtended'
        - $ref: './SVTA_OC_openAPI_COI_2a.yaml#/components/schemas/FCI_COI2a_capabilityvalue'
        - $ref: './SVTA_OC_openAPI_COI_2g.yaml#/components/schemas/FCI_COI2g_capabilityvalue'
        - $ref: './SVTA_OC_openAPI_COI_2h.yaml#/components/schemas/FCI_COI2h_capabilityvalue'
        - $ref: './SVTA_OC_openAPI_COI_2i.yaml#/components/schemas/FCI_COI2i_capabilityvalue'
    FCI.MetadataExtended:
      type: object
      description: 'The FCI.MetadataExtended object is used to indicate support for CDNI GenericMetadata types as defined in [RFC8006] and related IETF drafts. '
      properties:
        external-profile:
          description: 'Uniform Resource Locator (URL) to an externally defined FCI.MetadataExtended JavaScript Object Notation (JSON) definition. If not specified, the capabilities advertisement is self-contained within the supported-objects and supported-mel-features  properties. When specified, any of the properties that are also specified will take precedence over its counterparts in the external profile.'
          type:  string
        supported-objects:
          description: 'A list of FCI.SupportedMIObject objects to advertise all of the MI objects supported by the dCDN. A dCDN MUST provide an entry for each top-level MI object that it supports. An MI object MAY appear multiple times with different support for different contexts. The same context MUST NOT be specified for more than one variant of the same MI object, where variants are distinct based on their checksum. A top-level MI object MUST be included per a given list of contexts. The top-level MI object either describes support for an explicit properties tree or refers to one with a matching checksum that is listed in an externally referenced file. Subobjects (objects that are defined wholly within the context of a top-level object) are NOT specified independently as FCI.SupportedMIObject objects, but rather as part of the unrolled properties of a top-level object, per the specified contexts of that object. When specified, it takes precedence over the external profile (if specified). If external-profile is not used, and supported-objects is either not present or an empty list, the dCDN supports only structural metadata, (i.e., it can parse metadata as a transit CDN but cannot enforce security policies or deliver content).'
          type: array
          items:
            $ref: '#/components/schemas/FCI.SupportedMIObject'
        supported-mel-features:
          description: 'An FCI.SupportedMELFeatures object as defined in the Metadata Expression Language (MEL) Specification [SVTA2031]. It enables a dCDN to advertise which MEL features are supported. If not present here nor in an external profile, it is assumed that the dCDN has no support for the MEL.'
          $ref: './SVTA_OC_openAPI_COI_2a.yaml#/components/schemas/FCI.SupportedMELFeatures'
    FCI.SupportedMIObject:
      type: object
      description: 'The FCI.SupportedMIObject object is a subobject of FCI.MetadataExtended, and is used to advertise a dCDNs support for the object, as well as OPTIONAL allowed usage context and value restrictions.'
      required:
        - object-name
      properties:
        object-name:
          description: 'Name of the top-level MI object for which support is being advertised.'
          type: string
        object-checksum:
          description: 'MD5 checksum string applied on a canonical string representation of this object concatenating its properties sorted keys and values. When added, it can be used as a quick indication for the human eye that two objects are identical.'
          type: string
        allowed-contexts:
          description: 'A list of strings where each string is a usage contexts (parent objects and properties) within which this MI object can be used. A context can be defined as a path of properties from a top-level object, allowing a dCDN to advertise, for example, that it supports a particular MI object only within some, but not all, processing stages [SVTA2032]. Usage context names take the form: <usage-context> :: = <object-name> |<object-name> “.” <property-path><property-path>::= <property-name> |  property-name> “.” <property-name>. If unspecified, it is assumed that the MI object can be used within any context (bounded by any restrictions defined within the specification of the parent and child MI objects).'
          type:  array 
          items:
            type: string
            enum: [HostMetadata.metadata, PathMetadata.metadata, CDNProperty.property-metadata, ClientRequestStage, ProcessingStages.client-request, stage-metadata, generic-metadata, ClientResponseStage, OriginRequestStage, OriginResponseStage]
        supported-properties:
          description: 'An unwound properties tree representation of the MI object properties and their possible values. The content of this object is assumed to be uniquely represented by the object-checksum field.'
          type:  object
          additionalProperties: {}
# MI objects
    MI.HostIndex:
      type: object
      description: 'The HostIndex object is the entry point into the CDNi Metadata hierarchy.  It contains an array of HostMatch objects. An incoming content request is checked against the hostname (or IP address) specified by each of the listed HostMatch objects to find the HostMatch object that applies to the request.'
      required:
        - hosts
      properties:
        hosts:
          description: 'Array of HostMatch objects.  Hosts (HostMatch objects) MUST be evaluated in the order they appear, and the first HostMatch object that matches the content request being processed MUST be used.'
          type: array
          items:
            $ref: '#/components/schemas/MI_HostMatch'
    MI_HostMatch:
      oneOf:
        - $ref: '#/components/schemas/MI.HostMatch'
        - $ref: '#/components/schemas/MI_link'
    MI.HostMatch:
      type: object
      required:
        - host
        - host-metadata
      properties:
        host:
          $ref: '#/components/schemas/MI_endpoint'
          description: 'Hostname or IP address and optional port to match against the requested host, i.e., the host and port as described in [RFC3986]. In order for a hostname or IP address in a content request to match the hostname or IP address in the "host" property, the value from the content request when converted to lowercase MUST be identical to the value of the "host" property when converted to lowercase. All implementations MUST support IPv4 addresses encoded as specified by the "IPv4address" rule in Section 3.2.2 of [RFC3986]. IPv6 addresses MUST be encoded in one of the IPv6 address formats specified in [RFC5952], although receivers MUST support all IPv6 address formats specified in [RFC4291]. Hostnames MUST conform to the Domain Name System (DNS) syntax defined in [RFC1034] and [RFC1123]. Internationalized Domain Names (IDNs) must first be transformed to the A-label form [RFC5890] as per [RFC5891].'
        host-metadata:
          $ref: '#/components/schemas/MI_HostMetadata'
          description: 'CDNi Metadata to apply when delivering content that matches this host.'
    MI_HostMetadata:
      oneOf:
        - $ref: '#/components/schemas/MI.HostMetadata'
        - $ref: '#/components/schemas/MI_link'
    MI.HostMetadata:
      type: object
      description: 'A HostMetadata object contains the CDNi Metadata properties for content served for a particular host (defined in the HostMatch object) and possibly child PathMatch objects.'
      required:
        - metadata
      properties:
        metadata: 
          type: array
          items:
            $ref: '#/components/schemas/MI_GenericMetadata'
        paths:
          type: array
          description: 'Description: Path-specific rules.  Path patterns (PathMatch objects) MUST be evaluated in the order they appear, and the first (and only the first) PathMatch object that matches the content request being processed MUST be used.'
          items:
            $ref: '#/components/schemas/MI_PathMatch'
    MI_PathMatch:
      oneOf:
        - $ref: '#/components/schemas/MI.PathMatch'
        - $ref: '#/components/schemas/MI_link'
    MI.PathMatch:
      type: object
      description: 'A PathMatch object contains a PatternMatch object with a path to match against a resource URI path, as well as how to handle URI query parameters.  The PathMatch object also contains a PathMetadata object with GenericMetadata to apply if the resource URI matches the pattern within the PatternMatch object.'
      required:
        - path-pattern
        - path-metadata
      properties:
        path-pattern:
          $ref: '#/components/schemas/MI_PatternMatch'          
        path-metadata:
          $ref: '#/components/schemas/MI_PathMetadata'
    MI_PatternMatch:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.PatternMatch'
    MI.PatternMatch:
      type: object
      required:
        - pattern
      properties:
        pattern:
          type: string
          description: 'Description: A pattern for matching against the URI path, i.e., against the path-absolute [RFC3986]. The pattern can contain the wildcards "*" and "?", where "*" matches any sequence of pchar [RFC3986] or "/" characters (including the empty string) and "?" matches exactly one pchar character.  The three literals "$", "*", and "?"  MUST be escaped as "$$", "$*", and "$?" (where "$" is the designated escape character). All other characters are treated as literals'
        case-sensitive:
          type: boolean
          description: 'Flag indicating whether or not case-sensitive matching should be used. Note: Case insensitivity applies to ALPHA characters in the URI path prior to percent-decoding [RFC3986].'
          default: false
    MI_PathMetadata:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.PathMetadata'
    MI.PathMetadata:
      type: object
      description: 'A PathMetadata object contains the CDNi Metadata properties for content requests that match against the associated URI path (defined in a PathMatch object). Note that if DNS-based redirection is employed, then a dCDN will be unable to evaluate any metadata at the PathMetadata level or below because only the hostname of the content request is available at Request Routing time. dCDNs SHOULD still process all PathMetadata for the host before responding to the redirection request to detect if any unsupported metadata is specified. If any metadata not supported by the dCDN is marked as mandatory-to-enforce, the dCDN SHOULD NOT accept the content redirection request, in order to avoid receiving content requests that it will not be able to satisfy/serve.'
      required:
        - metadata
      properties:
        metadata:
          type: array
          items:
            $ref: '#/components/schemas/MI_GenericMetadata'
        paths:
          type: array
          description: 'Description: Path-specific rules.  Path patterns (PathMatch objects) MUST be evaluated in the order they appear, and the first (and only the first) PathMatch object that matches the content request being processed MUST be used.'
          items:
            $ref: '#/components/schemas/MI_PathMatch'
    MI_SourceMetadata:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.SourceMetadata'  
    MI.SourceMetadata:
      type: object
      description: 'Source metadata provides the dCDN with information about content acquisition, i.e., how to contact a uCDN Surrogate or an origin server to obtain the content to be served.  The sources are not necessarily the actual origin servers operated by the Content Service Provider (CSP)  but might be a set of Surrogates in the uCDN.'
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/MI_Source'
    MI_Source:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.Source'    
    MI.Source:
      type: object
      description: 'A Source object describes the source to be used by the dCDN for content acquisition (e.g., a Surrogate within the uCDN or an alternate origin server), the protocol to be used, and any authentication method to be used when contacting that source. Endpoints within a Source object MUST be treated as equivalent/equal. A uCDN can specify an array of MI.Source, ordered by preference, within a SourceMetadata object.  Then, for each Source object ranked by preference, a uCDN can specify an array of endpoints that are equivalent (e.g., a pool of servers that are not behind a load balancer).'
      required:
        - endpoints
        - protocol
      properties:
        acquisition-auth: 
          $ref: '#/components/schemas/MI_Auth'
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/MI_endpoint'
        protocol:
          $ref: '#/components/schemas/MI_protocol'
    MI_LocationACL:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.LocationACL'  
    MI.LocationACL:
      type: object
      description: 'LocationACL metadata defines which locations a User Agent needs to be in, in order to be able to receive the associated content. A LocationACL that does not include a "locations" property results in an action of "allow all", meaning that delivery can be performed regardless of the User Agent location; otherwise, a CDN MUST take the action from the first footprint to match against the User Agent location. If two or more footprints overlap, the first footprint that matches against the User Agent location determines the action a CDN MUST take. If the "locations" property is included but is empty or if none of the listed footprints match the User Agent location, then the result is a action of "deny". Although the LocationACL, TimeWindowACL, and ProtocolACL are independent GenericMetadata objects, they can provide conflicting information to a dCDN, e.g., a content request that is simultaneously allowed based on the LocationACL and denied based on the TimeWindowACL.  The dCDN MUST use  the logical AND of all ACLs (where "allow" is true and "deny" is false) to determine whether or not a request should be allowed.'
      properties:
        locations:
          type: array
          items:
            $ref: '#/components/schemas/MI_LocationRule'
    MI_LocationRule:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.LocationRule'
    MI.LocationRule:
      type: object
      description: 'A LocationRule contains or references an array of Footprint objects and the corresponding action.'
      required:
        - footprints
      properties:
        footprints:
          type: array
          items:
            $ref: '#/components/schemas/MI_Footprint'
        action:
          type: string
          enum: [allow, deny]
          default: deny
    MI_Footprint:
        oneOf:
          - $ref: '#/components/schemas/MI_link'
          - $ref: '#/components/schemas/MI.Footprint'  
    MI.Footprint:
      type: object
      description: 'A Footprint object describes the footprint to which a LocationRule can be applied, e.g., an IPv4 address range or a geographic location.'
      required:
        - footprint-type
        - footprint-value
      properties:
        footprint-type:
           $ref: '#/components/schemas/MI_footprinttype'
        footprint-value:
          type: array
          items:
            $ref: '#/components/schemas/MI_footprintvalue'
    MI_footprinttype:
      type: string
      enum: [ipv4cidr, ipv6cidr, asn, countrycode]
    MI_footprintvalue:
      oneOf:
        - $ref: '#/components/schemas/MI_ipv4cidr'
        - $ref: '#/components/schemas/MI_ipv6cidr'
        - $ref: '#/components/schemas/MI_asn'
        - $ref: '#/components/schemas/MI_countrycode'
    MI_TimeWindowACL:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.TimeWindowACL'
    MI.TimeWindowACL:
      description: 'A TimeWindowACL that does not include a "times" property results in an action of "allow all", meaning that delivery can be performed regardless of the time of the User Agent request; otherwise, a CDN MUST take the action from the first window to match against the current time. If two or more windows overlap, the first window that matches against the current time determines the action a CDN MUST take. If the "times" property is included but is empty or if none of the listed windows match the current time, then the result is an action of "deny".'
      type: object
      properties:
        times:
          type: array
          items:
            $ref: '#/components/schemas/MI_TimeWindowRule'
    MI_TimeWindowRule:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.TimeWindowRule'
    MI.TimeWindowRule:
      type: object
      description: ' A TimeWindowRule contains or references an array of TimeWindow objects and the corresponding action.'
      properties:
        windows:
          type: array
          items:
            $ref: '#/components/schemas/MI_TimeWindow'
        action:
          type: string
          enum: [allow, deny]
          default: deny
    MI_TimeWindow:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.TimeWindow'
    MI.TimeWindow:
      type: object
      required:
        - start
        - end
      properties:
        start:
          $ref: '#/components/schemas/MI_time'
        end:
          $ref: '#/components/schemas/MI_time'
    MI_ProtocolACL:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.ProtocolACL'
    MI.ProtocolACL:
      type: object
      description: 'ProtocolACL metadata defines delivery protocol restrictions. A ProtocolACL that does not include a protocol-acl property results in an action of "allow all", meaning that delivery can be performed regardless of the protocol in the User Agent request; otherwise, a CDN MUST take the action from the first protocol to match against the request protocol. If two or more request protocols overlap, the first protocol that matches the request protocol determines the action a CDN MUST take. If the protocol-acl property is included but is empty or if none of the listed protocols match the request protocol, then the result is an action of "deny". Although the LocationACL (see Section 4.2.2), TimeWindowACL (see Section 4.2.3), and ProtocolACL are independent GenericMetadata objects, they can provide conflicting information to a dCDN, e.g., a content request that is simultaneously allowed based on the ProtocolACL and denied based on the TimeWindowACL.  The dCDN MUST use the logical AND of all ACLs (where "allow" is true and "deny" is false) to determine whether or not a request should be allowed.'
      properties:
        protocol-acl:
          type: array
          items:
            $ref: '#/components/schemas/MI_ProtocolRule'
    MI_ProtocolRule:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.ProtocolRule'
    MI.ProtocolRule:
      type: object
      description: 'A ProtocolRule contains or references an array of Protocol objects and the corresponding action.'
      required:
        - protocols
      properties:
        protocols:
          type: array
          items:
            $ref: '#/components/schemas/MI_protocol'
        action:
          type: string
          enum: [allow, deny]
          default: deny
    MI_Cache:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.Cache'    
    MI.Cache:
      type: object
      description: ' A Cache object describes the cache control parameters to be applied to the content by intermediate caches. Cache keys are generated from the URI of the content request [RFC7234]. In some cases, a CDN or content provider might want certain path segments or query parameters to be excluded from the cache key generation. The Cache object provides guidance on what parts of the path and query string to include.'
      properties:
        exclude-path-pattern:
          description: 'A pattern for matching against the URI path, i.e., against the path-absolute [RFC3986]. The pattern can contain the wildcards "*" and "?", where "*" matches any sequence of pchar [RFC3986] or "/" characters (including the empty string) and "?" matches exactly one pchar character.  The three literals "$", "*", and "?"  MUST be escaped as "$$", "$*", and "$?" (where "$" is the designated escape character).  All other characters are treated as literals. Cache key generation MUST only include the portion of the path-absolute that matches the wildcard portions of the pattern. Note: Inconsistency between the PatternMatch pattern and the exclude-path-pattern can result in inefficient caching.'
          type: string
        include-query-strings:
          description: 'Allows a Surrogate to specify the URI query string parameters [RFC3986] to include when comparing the requested URI against the URIs in its cache for equivalence.  Matching query parameters MUST be case insensitive. If all query parameters should be ignored, then the list MUST be specified and MUST be empty.  If a query parameter appears multiple times in the query string, each instance value MUST be aggregated prior to comparison.  For consistent cache key generation, query parameters SHOULD be evaluated in the order specified in this array.'
          type: array
          items: 
            type: string
    MI_DeliveryAuthorization:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.DeliveryAuthorization'
    MI.DeliveryAuthorization:
      type: object
      description: 'Delivery authorization defines authorization methods for the delivery of content to User Agents.'
      properties:
        delivery-auth-methods:
          description: 'Options for authorizing content requests. Delivery for a content request is authorized if any one of the authorization methods in the list is satisfied for that request.'
          type: array
          items:
            $ref: '#/components/schemas/MI_Auth'
    MI_UriSigning:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.UriSigning'
    MI.UriSigning:
      type: object
      description: 'The UriSigning Metadata object contains information to enable URI signing and verification by a dCDN. According to section 4.4 of "URI Signing for CDN Interconnection (CDNi) https://datatracker.ietf.org/doc/html/rfc9246.'
      properties:
        enforce: 
          type: boolean
          default: true
          description: 'URI Signing enforcement flag.  Specifically, this flag indicates if the access to content is subject to URI Signing. URI Signing requires the dCDN to ensure that the URI is signed and verified before delivering content.  Otherwise, the dCDN does not perform verification, regardless of whether or not the URI is signed.'
        issuers:
          type: array
          items:
            type: string
          description: 'A list of valid Issuers against which the Issuer claim in the signed JWT may be verified.'
        package-attribute:
          type: string
          description: 'The name to use for the URI Signing Package. Default name is "URISigningPackage".'
        jwt-header:
          type: string
          description: 'The header part of JWT that is used for generating or verifying a signed JWT when the JWT token in the URI Signing Package does not contain a header part.  By default, the header is assumed to be included in the JWT token.'
      example:
        value: {
         "enforce": true,
         "issuers": ["csp", "ucdn1", "ucdn2"],
         "package-attribute": "usp",
         "jwt-header":
           {
               "alg": "ES256",
               "kid": "P5UpOv0eMq1wcxLf7WxIg09JdSYGYFDOWkldueaImf0"
           }
        }
    MI_Grouping:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.Grouping'      
    MI.Grouping:
      type: object
      description: 'A Grouping object identifies a group of content to which a given asset belongs.'
      properties:
        ccid: 
          type: string
          description: 'Content Collection IDentifier for an application-specific purpose such as logging aggregation.'
    MI_FallbackTarget:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.FallbackTarget'  
    MI.FallbackTarget: 
      type: object
      description: 'Extension from RFC 8804: Open Caching requires that the uCDN provides a fallback target server to the dCDN to be used in cases where the dCDN cannot properly handle the request.  To avoid redirect loops, the fallback target server address at the uCDN MUST be different  from the original uCDN address from which the client was redirected to the dCDN.  The uCDN MUST avoid further redirection when receiving the client request at the fallback target.  The Fallback Target is defined as a metadata object (see Section 3.3 of [RFC8006]).'
      required:
        - host
      properties:
        host:
          description: 'Endpoint object as defined in Section 4.3.3 of [RFC8006], with the limitation that in case of DNS delegation, it SHOULD NOT include a port number, and in case a port number is present, the dCDN MUST ignore it.'
          $ref: '#/components/schemas/MI_endpoint'
        scheme:
          description: 'A URI scheme to be used in the redirect response location construction.  When present, the dCDN MUST use the provided scheme in for HTTP redirection to the uCDN.'
          type: string
          enum: [http, https]
    MI_protocol:
      type: string
      enum: [http/1.1, https/1.1, http/2, http/3]
    MI_endpoint:
      type: string
      description: 'A hostname (with optional port) or an IP address (with optional port). All implementations MUST support IPv4 addresses encoded as specified by the "IPv4address" rule in Section 3.2.2 of [RFC3986]. IPv6 addresses MUST be encoded in one of the IPv6 address formats specified in [RFC5952], although receivers MUST support all IPv6 address formats specified in [RFC4291]. Hostnames MUST conform to the Domain Name System (DNS) syntax defined in [RFC1034] and [RFC1123]. Internationalized Domain Names (IDNs) must first be transformed to the A-label form [RFC5890] as per [RFC5891].'
    MI_time:
      type: integer
      format: int32
      description: 'A time value expressed in seconds since the UNIX epoch (i.e., zero hours, zero minutes, zero seconds, on January 1, 1970) Coordinated Universal Time (UTC) [POSIX].'
    MI_ipv4cidr:
      description: 'An IPv4address Classless Inter-Domain Routing (CIDR) block encoded as specified by the "IPv4address" rule in Section 3.2.2 of [RFC3986] followed by a "/" followed by an unsigned integer representing the leading bits of the routing prefix (i.e., IPv4 CIDR notation). Single IP addresses can be expressed as /32.'
      type: string
    MI_ipv6cidr:
      description: 'An IPv6address CIDR block encoded in one of the IPv6 address formats specified in [RFC5952] followed by a "/" followed by an unsigned integer representing the leading bits of the routing prefix (i.e., IPv6 CIDR notation).  Single IP addresses can be expressed as /128.'
      type: string
    MI_asn:
      description: 'An ASN value encoded as a string consisting of the characters "as" (in lowercase) followed by the ASN [RFC6793].'
      type: string
    MI_countrycode: 
      description: ' An ISO 3166-1 alpha-2 code [ISO3166-1] in lowercase.'
      type: string
    MI_Auth:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.Auth'
    MI.Auth:
      type: object
      description: 'An Auth object defines authentication and authorization methods to be used during content acquisition and content delivery respectively.'
      properties:
        auth-type:
          oneOf:
            - $ref: '#/components/schemas/MI_authtype'
            - $ref: './SVTA_OC_openAPI_COI_2d.yaml#/components/schemas/MI_COI2d_authtype'
        auth_value:
          oneOf:
            - $ref: '#/components/schemas/MI_authvalue'
            - $ref: './SVTA_OC_openAPI_COI_2d.yaml#/components/schemas/MI_COI2d_authvalue'
    MI_authtype:
        type: string
        enum: [MI.UriSigning]
    MI_authvalue:
      $ref: '#/components/schemas/MI_UriSigning'
    MI_link:
      type: object
      description: ' Link object can be used in place of any of the objects described above.  Link objects can be used to avoid duplication if the same metadata information is repeated within the metadata tree.  When a Link object replaces another object, its "href" property is set to the URI of the resource and its "type" property is set to the CDNi Payload Type of the object it is replacing. dCDNs can detect the presence of a Link object by detecting the presence of a property named "href" within the object.  This means that GenericMetadata types MUST NOT contain a property named "href" because doing so would conflict with the ability for dCDNs to detect Link objects being used to reference a GenericMetadata object.'
      required:
        - href
      properties:
        href:
          type: string
          format: Uri
        type:
          $ref: '#/components/schemas/MI_metadatatype'
    MI_metadatatype:
      oneOf:
        - $ref: '#/components/schemas/MI_payloadtype'
        - $ref: './SVTA_OC_openAPI_LOI.yaml#/components/schemas/MI_LOI_payloadtype'
        - $ref: './SVTA_OC_openAPI_COI_2a.yaml#/components/schemas/MI_COI2a_payloadtype'
        - $ref: './SVTA_OC_openAPI_COI_2b.yaml#/components/schemas/MI_COI2b_payloadtype'
        - $ref: './SVTA_OC_openAPI_COI_2c.yaml#/components/schemas/MI_COI2c_payloadtype'
        - $ref: './SVTA_OC_openAPI_COI_2d.yaml#/components/schemas/MI_COI2d_payloadtype'
    MI_payloadtype:
      type: string
      enum: [MI.ServiceIDs, MI.GenericMetadata]
    MI_metadatavalue:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI_payloadvalue'
        - $ref: './SVTA_OC_openAPI_LOI.yaml#/components/schemas/MI_LOI_payloadvalue'
        - $ref: './SVTA_OC_openAPI_COI_2a.yaml#/components/schemas/MI_COI2a_payloadvalue'
        - $ref: './SVTA_OC_openAPI_COI_2b.yaml#/components/schemas/MI_COI2b_payloadvalue'
        - $ref: './SVTA_OC_openAPI_COI_2c.yaml#/components/schemas/MI_COI2c_payloadvalue'
        - $ref: './SVTA_OC_openAPI_COI_2d.yaml#/components/schemas/MI_COI2d_payloadvalue'
    MI_payloadvalue:
      oneOf:
        - $ref: '#/components/schemas/MI.ServiceIDs'        
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.GenericMetadata' 
    MI_GenericMetadata:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.GenericMetadata'   
    MI.GenericMetadata:
      type: object
      description: 'GenericMetadata object extended by SVA.'
      required:
        - generic-metadata-type
        - generic-metadata-value
      properties:
        generic-metadata-type:
          $ref: '#/components/schemas/MI_metadatatype'
        generic-metadata-value:
          $ref: '#/components/schemas/MI_metadatavalue'
        mandatory-to-enforce:
          type: boolean
          description: 'Flag identifying whether or not the enforcement of the property metadata is required.'
          default: true
        safe-to-redistribute:
          type: boolean
          description: 'Flag identifying whether or not the property metadata can be safely redistributed without modification.'
          default: true
        incomprehensible:
          type: boolean
          description: 'Flag identifying whether or not any CDN in the chain of delegation has failed to understand and/or failed to properly transform this metadata object.  Note: This flag only applies to metadata objects whose safe-to-redistribute property has a value of False.'
    MI_ServiceIDs:
      oneOf:
        - $ref: '#/components/schemas/MI_link'
        - $ref: '#/components/schemas/MI.ServiceIDs'
    MI.ServiceIDs:
      type: object
      description: 'Allows for the specification of two tiers of CDN-specific identifiers and names. The interpretation of these identifiers is implementation specific.'
      properties:
        service-id:
          description: 'A provider-specific identifier for the service (typically a customer account identifier); either a literal (static string) or an expression using CDNI-MEL to dynamically construct the ID from elements of the HTTP request and/or response.'
          type: string
        service-id-is-expression:
          description: 'Flag to signal whether the service-id is a static string literal or a CDNI-MEL expression that needs to be dynamically evaluated.'
          type: boolean
          default: false
        service-name:
          description: 'Human-readable name for the service-id.'
          type: string
        property-id:
          description: 'A provider-specific identifier for the property (typically identifies a child configuration within the parent service-id); either a literal (static string) or an expression using CDNI-MEL to dynamically construct the ID from elements of the HTTP request and/or response.'
          type: string
        property-id-is-expression:
          description: 'Flag to signal whether the property-id is a static string literal or a CDNI-MEL expression that needs to be dynamically evaluated.'
          type: boolean
          default: false
        property-name:
          description: 'Human-readable name for the property-id.'
          type: string
      example:
        value: {
                "service-id" : "12345",
                "service-name" : "My Streaming Service",
                "property-id" : "$path_element(req.uri, 1)",
                "property-id-is-expression" : true
                }          
# CI (Control) interface (RFC 8007) 
# Regsitered CI payload types in IANA: https://www.iana.org/assignments/cdni-parameters/cdni-parameters.xhtml
    ci-trigger-command:
      type: object
      required:
        - cdn-path 
      properties:
        cdn-path:
          $ref: '#/components/schemas/CI_cdn-path'
          description: 'The CDN PIDs of CDNs that have already issued the CI/T Command to their dCDNs'
        cancel:
          $ref: '#/components/schemas/CI_cancel'
          description: 'The URLs of Trigger Status Resources for CI/T Trigger Commands that the uCDN wants to cancel'
        trigger:
          $ref: '#/components/schemas/CI_trigger'
          description: 'A specification of the trigger type and a set of data to act upon'
    ci-trigger-status:
      type: object
      description: 'Trigger Status Resource created by the dCDN once processing a ci-trigger-Command'
      required:
        - trigger
        - ctime
        - mtime 
        - status
      properties:
        trigger:
          $ref: '#/components/schemas/CI_trigger'
          description: 'The Trigger Specification posted in the body of the CI/T Command. Note that this need not be a byte-for-byte copy. For example, in the JSON representation the dCDN may re-serialize the information differently.'
        ctime:
          $ref: '#/components/schemas/CI_time'
          description: 'Time at which the CI/T Command was received by the dCDN. Time is determined by the dCDN; there is no requirement to synchronize clocks between interconnected CDNs'
        mtime:
          $ref: '#/components/schemas/CI_time'
          description: 'Time at which the Trigger Status Resource was last modified. Time is determined by the dCDN; there is no requirement to synchronize clocks between interconnected CDNs' 
        etime:
          $ref: '#/components/schemas/CI_time'
          description: 'Estimate of the time at which the dCDN expects to complete the activity. Time is determined by the dCDN; there is no requirement to synchronize clocks between interconnected CDNs'
        status:
          $ref: '#/components/schemas/CI_status'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/CI_error'
    CI_status:
      type: string
      enum: [pending, active, complete, processed, failed, canceling, canceled]
    CI_error:
      type: object
      required:
        - error
      description: 'Metadata and content references copied from the Trigger Specification.  Only those URLs and patterns to which the error applies are included in each property, but those URLs and patterns MUST be exactly as they appear in the request; the dCDN MUST NOT generalize the URLs. For example, if the uCDN requests pre-positioning of URLs "https://content.example.com/a" and "https://content.example.com/b", the dCDN must not generalize its error report to the pattern "https://content.example.com/*".)'
      properties:
        error:
          type: string
          enum: [emeta, econtent, eperm, ereject, ecdn, ecanceled, eunsupported]
        metadata.urls:
          $ref: '#/components/schemas/CI_urls'
          description: 'Copied from the CI_trigger related request/command concerned by the error'
        content.urls:
          $ref: '#/components/schemas/CI_urls'
          description: 'Copied from the CI_trigger related request/command concerned by the error'
        metadata.patterns:
          $ref: '#/components/schemas/CI_patterns'
          description: 'The metadata the trigger applies to'
        content.patterns:
          $ref: '#/components/schemas/CI_patterns'
          description: 'The content the trigger applies to'
        description:
          type: string
          description: 'A human-readable description of the error'
    CI_cdn-path:
      type: array
      items:
        type: string
    CI_cancel:
       type: array
       items:
          type: string
    CI_patterns:
      type: array
      items:
        type: object
        properties:
          pattern:
            type: string
          case-sensitive:
              type: boolean
              default: false
          match-query-string:
            type: boolean
            default: false
            description: 'Flag indicating whether to include the query part of the URI when comparing against the pattern.'    
    CI_urls:
      type: array
      items:
        type: string
      description: 'The URLs of content the CI Trigger Command applies to.'
    CI_trigger:
        type: object
        required:
          - type
        properties:
          type:
            type: string
            enum: [preposition, invalidate, purge]
          metadata.urls:
            $ref: '#/components/schemas/CI_urls'
            description: 'The uCDN URLs of the metadata the CI/T Trigger Command applies to. At least metadata.urls or content.urls must be present'
          content.urls:
            $ref: '#/components/schemas/CI_urls'
            description: 'The URLs of content the CI/T Trigger Command applies to. At least metadata.urls or content.urls must be present'
          content.ccid:
            type: array
            items:
              type: string
            description: 'The Content Collection IDentifier of content the trigger applies to. The "ccid" is a grouping of content, as defined by [RFC8006]'
          metadata.patterns:
            $ref: '#/components/schemas/CI_patterns'
            description: 'The metadata the trigger applies to. Not allowed with the "preposition" trigger'
          content.patterns:
            $ref: '#/components/schemas/CI_patterns'
            description: 'The content the trigger applies to. Not allowed with the "preposition" trigger'
    CI_time:
      type: number
      description: A JSON number, seconds since the UNIX epoch (00:00:00 UTC on 1 January 1970)