openapi: 3.0.1
info:
  title: Open Caching API - LOgging Interaface (LOI)
  description: 'This is the Open Caching API model as exposed by an ISP( dCDN) according to the Streaming Video Alliance (SVTA).'
  contact:
    email: guillaume.bichot@broadpeak.tv
  version: 1.0.0
externalDocs:
    description: Find out more
    url: 'https://opencaching.svta.org/'
components:
  schemas:
#FCI
    FCI_LOI_capabilitytype:
      type: string
      enum: [FCI.LoggingPush, FCI.LoggingSource, FCI.LoggingPullTransport]
    FCI_LOI_capabilityvalue:
      oneOf:
        - $ref: '#/components/schemas/FCI.LoggingPush'
        - $ref: '#/components/schemas/FCI.LoggingSource'
        - $ref: '#/components/schemas/FCI.LoggingPullTransport'
    FCI.LoggingPush:
      type: object
      description: 'The FCI.Logging object described in [RFC8008] is restricted to announcing available record types and OPTIONAL fields supported by the dCDN from those listed in [RFC7937]. This specification includes more record types that can be used by the uCDN in the log configuration as well as other possible metadata that can be used as container formats and possible pull transport methods. To permit the dCDN to announce multiple record types, container formats, and transport methods for the same footprint, this capability extends that described in [RFC8008] with a new capability dedicated to the push mechanisms.'
      required:
        - record-types
      properties:
        record-types:
          description: The supported list of record-types.
          type: array
          items:
            $ref: '#/components/schemas/FCI_recordtype' 
        container-formats:
          description: The supported list of The supported list of container formats.
          type: array
          items:
            $ref: '#/components/schemas/FCI_containerformat' 
        allow-include-headers:
          description: A flag indicating support for custom headers configured by the uCDN for inclusion in the log records.
          type: boolean
        applied-transforms:
          description: Transforms applied by the dCDN on all logs to the upstream. The sets of record-fields field names MUST NOT overlap for the transport.
          type: array
          items:
            $ref: '#/components/schemas/MI.LoggingTransforms'
        sftp-public-keys:
          description: An array of SSH public keys that the dCDN SHOULD authorize on SFTP logging endpoints.
          type: array
          items:
            type: string
    FCI.LoggingSource:
      description: 'A dCDN can provide information on available logging endpoints to the uCDN that do not require metadata configuration. The FCI.LoggingSource capability object can be announced with the relevant information for the uCDN to get the log from the dCDN.\nThe dCDN could provide different endpoints, depending on footprint and/or delegated hosts. It could be possible that the sources in FCI.LoggingSource in the dCDN are not available for all delegated hosts or all available footprints, permitting flexibility and control of its own infrastructure (e.g., a dCDN could limit logging endpoints to suitable hosts included in an agreement between a dCDN and uCDN).'
      properties: 
        hosts:
          description: One or more uCDN hosts for which the logs are available for pull logging transports. A redirecting host SHOULD be a host that was published in an MI.HostMatch object by the uCDN as defined in section 4.1.2 of [RFC8006]. If absent or empty, the logging endpoint is available for all hosts of the redirecting uCDN.
          type: array
          items:
            $ref: './SVTA_OC_openAPI_COI.yaml#/components/schemas/MI_endpoint'
        transports:
          description: List of available sources for an uCDN to obtain the logs for its delegated services
          type: array 
          items:
            $ref: '#/components/schemas/FCI.LoggingPullTransport'
    FCI.LoggingPullTransport:
      required:
        - transport-type
        - record-type
        - endpoint
      properties: 
        transport-type:
          description: The type discriminator for the endpoint property.
          type: string
          enum: [FCI.LoggingPullTransportAtomFeed, FCI.LoggingPullTransportSFTP, FCI.LoggingPullTransportS3]
        record-type:
          description: The format of the individual log records. This must be a valid value as defined in section 5.
          type: string
        container-metadata:
          description: The configuration for the generation of log files when operating in file-based modes.
          $ref: '#/components/schemas/MI.LoggingContainerMetadata'
        transforms:
          description: A list of transformations to be applied to sets of record fields before transport. A record field name SHOULD NOT appear more than once.
          type: array 
          items:
            $ref: '#/components/schemas/MI.LoggingTransforms'
        endpoint:
          description: An object with any configuration necessary for the specific logging transport, discriminated on the transport-type property. Objects for each transport type are described below.
          oneOf:
            - $ref: '#/components/schemas/FCI.LoggingPullTransportAtomFeed'
            - $ref: '#/components/schemas/FCI.LoggingPullTransportSFTP'
            - $ref: '#/components/schemas/FCI.LoggingPullTransportS3API'
    FCI.LoggingPullTransportAtomFeed:
      required:
        - feed-href
      properties: 
        feed-href:
          description: The URL of the CDNI logging feed in Atom format per [RFC7937].
          type: string
    FCI.LoggingPullTransportSFTP:
      required:
        - host
        - username
      properties: 
        host:
          description: The hostname of the SFTP server, which MUST be specified as either hostname or hostname:port.
          type: string
        username:
          description: The remote username to use for connecting to the SFTP server.
          type: string
        password:
          description: The remote password to use for connecting to the SFTP server when using password-based authentication. This field is not used when SSH keys are provided by the uCDN via MI.LoggingPullTransportMetadata.
          $ref: './SVTA_OC_openAPI_COI_2i.yaml#/components/schemas/MI.SecretValue'
    FCI.LoggingPullTransportS3API:
      required:
        - host
        - access-key-id
        - access-key-secret
        - bucket-name
      properties: 
        host:
          description: The hostname to connect to the S3-compatible API.
          type: string
        access-key-id:
          description: The access key ID to use when connecting to the API.
          type: string
        access-key-secret:
          description: The access key secret to use when connecting to the API.
          $ref: './SVTA_OC_openAPI_COI_2i.yaml#/components/schemas/MI.SecretValue'
        bucket-name:
          description: The bucket name to use to pull log file objects.
          type: string
    FCI_recordtype:
      type: string
      enum: [cdni_http_request_v1,opencaching_minimal_json_v1,opencaching_standard_json_v1,opencaching_extended_json_v1,opencaching_minimal_whitespace_v1,opencaching_standard_whitespace_v1,opencaching_extended_whitespace_v1,opencaching_minimal_csv_v1,opencaching_standard_csv_v1,opencaching_extended_csv_v1,opencaching_protobuf_v1]
    FCI_containerformat:
      type: string
      enum: [cdni_v1, json_v1, carriage_return_v1, linefeed_v1, tar_v1]
# MI
    MI_LOI_payloadtype:
      type: string
      enum: [MI.LoggingPullTransportMetadata, MI.LoggingTransport, MI.LoggingTransforms]
    MI_LOI_payloadvalue:
      oneOf:
        - $ref: '#/components/schemas/MI.LoggingPullTransportMetadata'
        - $ref: '#/components/schemas/MI.LoggingTransport'
        - $ref: '#/components/schemas/MI.LoggingTransforms'
    MI.LoggingMetadata:
      properties:
        transports:
          description: An array of MI.LoggingTransport objects.
          type: array
          items:
            $ref: '#/components/schemas/MI.LoggingTransport'
        pull-transport-metadata:
          description: An object that can be used to configure certain properties of dCDN pull transports.  
          $ref: '#/components/schemas/MI.LoggingPullTransportMetadata'
        sftp-public-keys:
          description: An array of SSH public keys that the dCDN SHOULD authorize on SFTP logging endpoints.
          type: array
          items: 
            type: string
    MI.LoggingPullTransportMetadata:
      properties:
        sftp-public-keys:
          description: An array of SSH public keys that the dCDN SHOULD authorize on SFTP logging endpoints.
          type: array
          items:
            type: string
    MI.LoggingTransport:
      description: MI.LoggingTransport objects are enclosed in the MI.LoggingMetadata object and instruct the dCDN how to transmit log files or streams to the uCDN.
      required:
        - transport-type
        - record-type
        - endpoint
      properties:
        transport-type:
          description: The type discriminator for the endpoint property.
          type: string
          enum: [MI.LoggingTransportKafka, MI.LoggingTransportSFTP, MI.LoggingTransportS3]
        record-type:
          description: The format of the individual log records. This MUST be a valid value as defined in Section 6.
          type: string
        container-metadata:
          description: The configuration for the generation of log files when operating in file-based modes. Mandatory-to-Specify if it is a File or object-based, No otherwise.
          $ref: '#/components/schemas/MI.LoggingContainerMetadata'
        include-headers:
          description: Additional header fields to include, dependent on dCDN support via the allow-include-headers flag of FCI.LoggingPush. Ordered array of header fields in sc-hdr-* and cs-hdr-* naming format (see logging specifiction).
          type: array
          items:
            type: string
        account-id:
          description: An account identifier value that the dCDN must include in log records.
          type: string
        endpoint:
          description: An object with any configuration necessary for the specific logging transport, discriminated on the transport-type property.
          oneOf:
            - $ref: '#/components/schemas/MI.LoggingTransportKafka'
            - $ref: '#/components/schemas/MI.LoggingTransportSFTP'
            - $ref: '#/components/schemas/MI.LoggingTransportS3API'
        transforms:
          description: Transformations on sets of fields as defined in an  MI.LoggingTransform. The sets of record-fields field names MUST NOT  overlap for the transport. 
          type: array 
          items:
            $ref: '#/components/schemas/MI.LoggingTransforms'
    MI.LoggingTransportKafka:
      required:
        - bootstrap-servers
        - topic
      properties: 
        bootstrap-servers:
          description: An array of the bootstrap connection servers in host:port format.
          type: array 
          items:
            type: string
        topic:
          description: The Kafka topic to which log records SHOULD be published.
          type: string
    MI.LoggingTransportSFTP:
      required:
        - host
        - username
      properties: 
        host:
          description: The hostname of the SFTP server, which MAY be specified as either hostname or hostname:port.
          type: string
        username:
          description: The remote username to use for connecting to the SFTP server.
          type: string
        password:
          description: The remote password to use for connecting to the SFTP server when using password-based authentication.
          $ref: './SVTA_OC_openAPI_COI_2i.yaml#/components/schemas/MI.SecretValue'
    MI.LoggingTransportS3API:
      required:
        - host
        - bucket-name
      properties: 
        host:
          description: The hostname to connect to the S3-compatible API.
          type: string
        access-key-id:
          description: The access key ID to use when connecting to the API.
          type: string
        access-key-secret:
          description: The access key secret to use when connecting to the API.
          $ref: './SVTA_OC_openAPI_COI_2i.yaml#/components/schemas/MI.SecretValue'
        bucket-name:
          description: The bucket name to use for pushed log file objects.
          type: string
    MI.LoggingTransforms:
      type: object
      description: 'Logging fields can contain personal user information that cannot be shared upstream or stored in the operating jurisdictions. These operations allow for obfuscation and anonymization of logging record fields. An array of MI.LoggingTransforms objects can be enclosed in the MI.LoggingTransport object transform field for uCDN configured obfuscation.The dCDN specifies privacy obfuscations in the FCI.Logging advertisement applied-transforms field.'
      required:
        - record-fields
        - transforms
      properties:
        record-fields:
          description: The list of privacy-sensitive log record fields for which obfuscation is applied.
          type: array
          items: 
            type: string
        transforms:
          description: The transform operations to apply on the record fields, in order.
          type: array
          items:
            $ref: '#/components/schemas/MI.LoggingTransform'
    MI.LoggingTransform:
      required:
        - type
        - value
      properties: 
        type:
          description: The type discriminator for the value property. The following values are supported
          type: string 
          enum: [MI.LoggingTransformReplace, MI.LoggingTransformTruncate, MI.LoggingTransformUrlRemoveParam, MI.LoggingTransformUrlStripParams, MI.LoggingTransformMaskIp, MI.LoggingTransformEncrypt, MI.LoggingTransformHash, MI.LoggingTransformEncode]
        value:
          description: The privacy operation configuration value.
          oneOf:
            - $ref: '#/components/schemas/MI.LoggingTransformReplace'
            - $ref: '#/components/schemas/MI.LoggingTransformTruncate'
            - $ref: '#/components/schemas/MI.LoggingTransformUrlRemoveParam'
            - $ref: '#/components/schemas/MI.LoggingTransformUrlStripParams'
            - $ref: '#/components/schemas/MI.LoggingTransformMaskIp'
            - $ref: '#/components/schemas/MI.LoggingTransformEncrypt'
            - $ref: '#/components/schemas/MI.LoggingTransformHash'
            - $ref: '#/components/schemas/MI.LoggingTransformEncode'
    MI.LoggingTransformReplace:
      required: 
        - regex
      properties: 
        regex:
          description: A POSIX substitution expression.
          type: string
    MI.LoggingTransformTruncate:
      description: This object removes characters from the end of a field value if it exceeds a defined length.
      required:
        - length
      properties:
        length:
          description: The maximum field length.
          type: number
    MI.LoggingTransformUrlRemoveParam:
      description: 'This object parses record-fields  values as URLs, stripping specified query parameters along with their values.'
      required:
        - remove-param
      properties: 
        remove-param:
          description: a POSIX Regular expression string. Omits URL query parameters whose name match a regular expression.
          type: string 
    MI.LoggingTransformUrlStripParams:
      required:
        - strip-params
      properties:
        strip-params:
          description: Strips all query parameters from the URL.
          type: boolean
    MI.LoggingTransformUrlPath:
      description: This object parses record-fields  values as URLs, and can replace or truncate path elements from the front or end. At least one of replace-path or path-trim MUST be present.
      properties: 
        replace-path:
          description: a POSIX string. Modify URL path elements with a regular expression.
          type: string
        path-trim:
          description: Trims elements from URL paths to a specified depth. A positive value will truncate the specified number of path elements from the end. A negative value will truncate from the front.
          type: number
    MI.LoggingTransformMaskIp:
      description: This object parses values as IPv4 or IPv6 strings, and outputs an address that strips the indicated number of bits.
      properties: 
        mask-lsb-v4:
          description: The number of bits to strip from the end of an IPv4 address. MAximum 32 for IPv4
          type: number
        mask-lsb-v6:
          description: The number of bits to strip from the end of an IPv6 address. Maximum 126 for IPv6
          type: number
    MI.LoggingTransformHash:
      description: This object replaces record-fields values with their Hash-Based Message Authentication Code (HMAC).
      required:
        - function
      properties:
        function:
          description: The hashing function to use in computing the HMAC of the private field value. 
          type: string
          enum: [MD5, SHA256]
        key:
          description: The key used in computing the HMAC. Required only if a key is used or an empty string, if the key is confidential to the dCDN
          $ref: './SVTA_OC_openAPI_COI_2i.yaml#/components/schemas/MI.SecretValue'
    MI.LoggingTransformEncrypt:
      description: With this object, fields are encrypted with the selected scheme, and the nonce used is prepended to the outputted ciphertext. The encryption key is specified as an MI.SecretValue and is transmitted in the transforms field with log records in the metadata  header or as a sidecar. When a new key is configured, a new file and sidecar must be created with an updated key reference.
      required:
        - algorithm
      properties: 
        algorithm:
          description: The algorithm to use in encrypting the private field value.
          type: string
          enum: [AEAD-XCHACHA20-POLY1305-IETF, AEAD-CHACHA20-POLY1305-IETF, AEAD-AES256-GCM, RC4] 
        key:
          description: A reference to an externally defined encryption key.
          $ref: './SVTA_OC_openAPI_COI_2i.yaml#/components/schemas/MI.SecretValue'
    MI.LoggingTransformEncode:
      required:
        - encoding
      properties:
        encoding:
          description: The encoding to use for the obfuscated value.
          type: string
          enum: [BASE64, BIN2HEX]
    MI.LoggingFilenameTemplate:
      description: 'The MI.LoggingFilenameTemplate type is used to specify the path and filename for files created by batch mode MI.LoggingTransport and FCI.LoggingTransport services. If the resulting filename is longer than 255 characters, it will be truncated to 255 characters in length, including the filename extension that will be retained. Fields that MAY be truncated are noted in the Logging specification.It is the responsibility of the dCDN to ensure that file names are unique. It is strongly RECOMMENDED that the %id field is used to ensure the uniqueness requirement is satisfied.The overall path length is limited to 32 KiB, and each path component is limited to 255 characters. Any element exceeding the length limitation will be truncated to the maximum length.'
      type: string
      example:
        {
        "template" : "/%cY-%cM-%cD/%cH_%cM_%cS.%source.%id.json"   
        }
    MI.LoggingContainerMetadata:
      description: This object defines configuration parameters used in file-based logging transports to define how files are created and formatted.
      required:
        - container-type
      properties: 
        container-type:
          description: 'The container type as defined in section 7 of the logging specification'
          type: string
          enum: [cdni_v1, json_v1, linefeed_v1, carriage_return_v1, tar_v1]
        filename-template:
          description: The template to be used for files pushed by a batch mode transport.
          $ref: '#/components/schemas/MI.LoggingFilenameTemplate'
        include-metadata-sidecar: 
          description: Used to specify if a metadata sidecar file is generated for each log file. See section 7.1.1.
          type: boolean
        interval:
          description: For file-based logging transports, the time period for which a single log file SHOULD cover before being pushed to the endpoint, with the duration in seconds.
          type: integer
        maximum-size:
          description: 'For batch-type logging transports, the maximum file or object size before the log file SHOULD be pushed to the endpoint and a new file created for further entries. The value of the format is “<Integer><Specifier>” where Specifier is one of the following:  M: megabyte / G: gigabyte'
          type: string
        archive-metadata:
          description: Used with the tar_v1 container type, it specifies the container metadata for files inside of the archive.
          $ref: '#/components/schemas/MI.LoggingContainerMetadata'
