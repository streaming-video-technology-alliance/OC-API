openapi: 3.0.1
info:
  title: Open Caching API - SVA OC API
  description: 'This is the Open Caching API model as exposed by an ISP( dCDN) according to the Streaming Video Alliance (SVA).'
  contact:
    email: guillaume.bichot@broadpeak.tv
  version: 0.3.0
externalDocs:
    description: Find out more
    url: 'https://www.streamingvideoalliance.org/'
security: 
  - jwt: []
paths:
  /OC/FCI/advertisement:
    get:
      tags:
        - OC_FCI
      summary: get the FCI advertisements according to SVA and CDNI (RFC8008/RFC8804)
      operationId: oc_fci_get_advertisement
      description: 'This operation is used to pull the FCI advertisement related to the requester (identified thanks to the security token obtained)'
      responses:
        '200':
          description: 'FCI advertisement'
          content:
            application/cdni:
              schema:
                type: array
                items:
                  $ref: './SVA_OC_CDNI_openapi.yaml#/components/schemas/FCI_genericbase'
        '400':
          description: 'bad request'
        '403':
          description: 'Forbiden'
        '404':
          description: 'No FCI advertisement'
  /OC/FCI/subscribe:
    post:
      tags:
        - OC_FCI
      summary: suscribe to FCI updates notifications
      operationId: oc_fci_post_subscribe
      description: ''
      requestBody:
        description: ''
        content:
          application/cdni:
            schema:
              type: object
              required:
                - notificationTarget
              properties:
                notificationTarget:
                  type: string
                notificationType:
                  type: string
                  enum: [fci]
        required: true
      callbacks:
        FciNotification:
          '{$request.body#/notificationTarget}':
            put:
              summary: 'The ISP OC/dCDN to post a FCI advertisement update.'
              description: 'This callback is used by the ISP OC/dCDN to post a FCI advertisement update.'
              tags:
              - OC_MI
              operationId: oc_fci_put_notification
              requestBody:
                description: Callback payload
                content: 
                  'application/cdni':
                    schema:
                      type: array
                      items:
                        $ref: './SVA_OC_CDNI_openapi.yaml#/components/schemas/FCI_genericbase'
              responses:
                '200':
                  description: 'FCI updated'
                '400':
                  description: 'bad request'
                '403':
                  description: 'Forbiden'
      responses:
        201:
          description: 'subscription created. The "Location" header gathes the URL of the newly created resource'
        400:
          description: 'bad request'
        403:
          description: 'Forbiden'
        404:
          description: 'No FCI advertisement'     
  /OC/FCI/subscription/{subscriptionId}:
    get:
      tags:
        - OC_FCI
      summary: get the FCI notification subscription 
      operationId: oc_fci_get_notificationSubscription
      description: ''
      parameters:
        - name: subscriptionId
          in: path
          required: true
          description: 'identifier of the subscription resource. This parameter is returned when creating the subscription'
          schema:
            type: string
      responses:
        200:
          description: 'FCI notification subscription'
          content:
            application/cdni:
              schema:
                type: object
                required:
                  - notificationTarget
                properties:
                  notificationTarget:
                   type: string
                  notificationType:
                    type: string
                    enum: [fci]
        400:
          description: 'bad request'
        403:
          description: 'Forbiden'
        404:
          description: 'Not found'
    delete:
      tags:
        - OC_FCI
      summary: 'delete the notification subscription'
      operationId: OC_fci_delete_notificationSubscription
      parameters:
        - name: subscriptionId
          in: path
          required: true
          description: 'idetifier of the subscription resource. This parameter is returned when creating the subscription'
          schema:
            type: string 
      responses:
        200:
          description: 'notification subscibtion deleted'
          content: {}
        400:
          description: Command is invalid
          content: {}
        403:
          description: Forbidden
          content: {}    
        404:
          description: 'Not found' 
  /OC/CI/configuration:
    put:
      tags:
        - OC_COI_simple
      summary: Communicates the metadata/configuration (RFC8006 + RFC8804) to the ISP with a simple API
      description: 'To be used when the metadata to communicate is pseudo static and simple. The ISP (dCDN) processes the request and answers immediately. For a more complex metadata then use the CI API.'
      operationId: oc_ci_configure
      requestBody:
        description: 'the metadata(configuration) to be considered/processed by the ISP According to SVA OpenCaching specification and CDNI RFCs 8006/8804. It is the entire dataset (HostIndex)'
        content:
          application/cdni;ptype=MI.HostIndex:
            schema:
              $ref: 'SVA_OC_CDNI_openapi.yaml#/components/schemas/MI.HostIndex'
        required: true
      responses:
        200:
          description: Command is ok
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                description: ' the status can either be complete or failed. The status report gathers the URL of the metadata configuration. Note that the status report is not kept by the dCDN. It is not necessary to delete it as with the CI API (conforming to RFC8007)'
                $ref: 'SVA_OC_CDNI_openapi.yaml#/components/schemas/ci-trigger-status'
        400:
          description: Command is invalid
        403:
          description: Forbidden
        404:
          description: Not found
    get:
      tags:
        - OC_COI_simple
      summary: 'Gets the whole  metadata configuration (RFC 8006)'
      description: 'This API is exposed by the dCDN and can be used by the uCDN to retrieve the whole valid (or not) configuration. It does not contain any metadata object references. Invalid metadata objects are marked with the properties safe-to-redistribute set to "false" and incomprehensible set to "true"'
      operationId: oc_ci_getConfiguration
      responses:
        200:
          description: 'prepositioned configuration metadata'
          content:
            application/cdni;ptype=MI.HostIndex:
              schema:
                $ref: 'SVA_OC_CDNI_openapi.yaml#/components/schemas/MI.HostIndex'
        400:
          description: Command is invalid
          content: {}
        403:
          description: Forbidden
          content: {}     
        404:
          description: Not found
          content: {}  
    delete:
      tags:
        - OC_COI_simple
      summary: 'delete the whole configuration'
      operationId: oc_ci_deleteConfiguration
      responses:
        200:
          description: 'Prepositioned configuration metadata is deleted/purged. This does cancel/stop the corresponding delegation'
          content: {}
        400:
          description: Command is invalid
          content: {}
        403:
          description: Forbidden
          content: {} 
  /OC/CI/configuration/{host}:
    put:
      tags:
        - OC_COI_simple_host
      summary: Communicates part of the metadata/configuration (RFC8006 + RFC8804) to the ISP with a simple API
      description: 'To be used when the metadata to communicate is pseudo static and simple. The ISP (dCDN) processes the request and answers immediately. For a more complex metadata then use the CI API.'
      operationId: oc_ci_configure_host
      parameters:
        - name: host
          in: path
          required: true
          description: 'paremeter allowing to create/update the configuration related to a host. "www.disney.com" allows to create or modify the configuration associated with that host name.'
          schema:
            type: string
      requestBody:
        description: 'the metadata(configuration) to be considered/processed by the ISP According to SVA OpenCaching specification and CDNI RFCs 8006/8804. It is the metadata associated with a host name. the MI.HostMetadata object must be provided'
        content:
          application/cdni;ptype=MI.HostIndex:
            schema:
              $ref: 'SVA_OC_CDNI_openapi.yaml#/components/schemas/MI.HostMetadata'
        required: true
      responses:
        200:
          description: Command is ok
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                description: ' the status can either be complete or failed. The status report gathers the URL of the metadata configuration. Note that the status report is not kept by the dCDN. It is not necessary to delete it as with the CI API (conforming to RFC8007)'
                $ref: 'SVA_OC_CDNI_openapi.yaml#/components/schemas/ci-trigger-status'
        400:
          description: Command is invalid
        403:
          description: Forbidden
        404:
          description: Not found
    get:
      tags:
        - OC_COI_simple_host
      summary: 'Gets part of the metadata configuration (RFC 8006)'
      description: 'This API is exposed by the dCDN and can be used by the uCDN to retrieve the  valid (or not) configuration associated with a host name. It does not contain any metadata object references. Invalid metadata objects are marked with the properties safe-to-redistribute set to "false" and incomprehensible set to "true"'
      operationId: oc_ci_getConfiguration_host
      parameters:
        - name: host
          in: path
          required: true
          description: 'paremeter allowing to get the configuration related to a host. "www.disney.com" allows to get the configuration associated with that host name.'
          schema:
            type: string
      responses:
        200:
          description: 'prepositioned configuration metadata. The MI.HostMetadata object is returned'
          content:
            application/cdni;ptype=MI.HostIndex:
              schema:
                $ref: 'SVA_OC_CDNI_openapi.yaml#/components/schemas/MI.HostMetadata'
        400:
          description: Command is invalid
          content: {}
        403:
          description: Forbidden
          content: {}  
        404:
          description: Not found
          content: {}
    delete:
      tags:
        - OC_COI_simple_host
      summary: 'delete part of the configuration related to a host name'
      operationId: oc_ci_deleteConfiguration_host
      parameters:
        - name: host
          in: path
          description: 'paremeter allowing to removed the configuration related to a host. "www.disney.com" allows to delete the configuration associated with that host name.'
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Part of the prepositioned configuration metadata, according to the host parameter, is deleted/purged. This does cancel/stop the corresponding delegation'
          content: {}
        400:
          description: Command is invalid
          content: {}
        403:
          description: Forbidden
          content: {} 
  /OC/CI/configuration/{host}/{path-pattern}:
    put:
      tags:
        - OC_COI_simple_path-pattern
      summary: Communicates the metadata/configuration (RFC8006 + RFC88004) to the ISP with a simple API
      description: 'To be used when the metadata to communicate is pseudo static and simple. The ISP (dCDN) processes the request and answers immediately. For a more complex metadata then use the CI API.'
      operationId: oc_ci_configure_host_pattern
      parameters:
        - name: host
          in: path
          description: 'Parameter indocating the host ("www.disney.com")'
          required: true
          schema:
            type: string
        - name: path-pattern
          in: path
          description: 'Paremeter allowing to create/update the configuration related to a host AND a path pattern (e.g. the path pattern  "/live/*" associated with the host "www.disney.com").'
          required: true
          schema:
            type: string
            format: URL
      requestBody:
        description: 'the metadata(configuration) to be considered/processed by the ISP According to SVA OpenCaching specification and CDNI RFCs 8006/8804. It is a part of it according to the host and path-pattern parameters. The MI.PathMetadata object is provided'
        content:
          application/cdni;ptype=MI.HostIndex:
            schema:
              $ref: 'SVA_OC_CDNI_openapi.yaml#/components/schemas/MI.PathMetadata'
        required: true
      responses:
        200:
          description: Command is ok
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                description: 'The status can either be complete or failed. The status report gathers the URL of the metadata configuration. Note that the status report is not kept by the dCDN. It is not necessary to delete it as with the CI API (conforming to RFC8007)'
                $ref: 'SVA_OC_CDNI_openapi.yaml#/components/schemas/ci-trigger-status'
        400:
          description: Command is invalid
        403:
          description: Forbidden
        404:
          description: Not found
    get:
      tags:
        - OC_COI_simple_path-pattern
      summary: 'Gets part of the metadata configuration (RFC 8006) associated with a path pattern'
      description: 'This API is exposed by the dCDN and can be used by the uCDN to retrieve the valid (or not) configuration. It does not contain any metadata object references. Invalid metadata objects are marked with the properties safe-to-redistribute set to "false" and incomprehensible set to "true"'
      operationId: oc_ci_getConfiguration_path-pattern
      parameters:
        - name: host
          in: path
          description: 'Parameter allowing to get the configuration related to a host.'
          required: true
          schema:
            type: string
        - name: path-pattern
          in: path
          description: 'Paremeter allowing to get the configuration related to a host AND a path pattern GET  /OC/CI/configuration/www.disney.com/live/*" to get metadata associated with that path pattern. The MI.PathMetadata object is returned'
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Part of the prepositioned configuration metadata according to the host and path-pattern parameters'
          content:
            application/cdni;ptype=MI.HostIndex:
              schema:
                $ref: 'SVA_OC_CDNI_openapi.yaml#/components/schemas/MI.PathMetadata'
        400:
          description: Command is invalid
          content: {}
        403:
          description: Forbidden
          content: {}     
        404:
          description: Not found
          content: {}  
    delete:
      tags:
        - OC_COI_simple_path-pattern
      summary: 'delete part of the configuration associated with a host name AND a path pattern'
      operationId: oc_ci_deleteConfiguration_path-pattern
      parameters:
        - name: host
          in: path
          description: 'paremeter allowing to indicate the host.'
          required: true
          schema:
            type: string
        - name: path-pattern
          in: path
          description: 'paremeter allowing to delete the configuration related to a host AND a path pattern.'
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Part of the prepositioned configuration metadata, according to the host and the path-pattern parameters, is deleted/purged. This does cancel/stop the corresponding delegation'
          content: {}
        400:
          description: Command is invalid
          content: {}
        403:
          description: Forbidden
          content: {} 
  /OC/CI/trigger:
    post:
      tags:
        - OC_CI_trigger
      summary: Communicates the metadata, configuration and/or content to the ISP with the CI/trigger API (RFC 8007)
      description: 'According to SVA OpenCaching specification and RFC 8007 for the Trigger protcool 
      and RFC 8006 (+ RFC8804) for the metadata structure'
      operationId: oc_ci_provision
      requestBody:
        description: the metadataset or a link to the set to be considered/processed by the ISP
        content:
          application/cdni;ptype=ci-trigger-command:
            schema:
              description: 'for triggering the creation of a trigger command for metadata or content pre-positioning. 
              The URL(s) present in the ci-trigger-commnd metadata.urls property should conformed to the callbacks format
               (see below)'
              $ref: 'SVA_OC_CDNI_openapi.yaml#/components/schemas/ci-trigger-command'
        required: true
      callbacks:
        requestMetadata:
          /OC/MI/metadata/{pathName}:
            get:
              summary: ''
              description: 'This callback is used by the ISP OC/dCDN to retrieve the metadata/configuration elements 
              referenced in the ci-trigger-command object and potentially generic metadata object (metadata_urls property) as specified in RFC8006/RFC8007'
              tags:
              - OC_MI
              operationId: oc_mi_get_metadata
              parameters:
                - name: pathName
                  in: path
                  description: 'the calbback url has a fqdn part followed by the mandatory "OC/MI/metadata/" followed by a path sufixe associated with 
                  the metadata object to be retrieved according to the MI API'
                  required: true
                  schema:
                    type: string
                    format: uri
              responses:
                200:
                  description: 'Returns the requested metadata object'
                  content:
                    application/cdni:
                      schema:
                        $ref: 'SVA_OC_CDNI_openapi.yaml#/components/schemas/MI.HostIndex'
                404:
                  description: Not found
                  content: {}
        requestContent:
          /OC/CI/content/{pathName}:
            get:
              summary: ''
              description: 'This callback is used by the ISP OC/dCDN to retrieve the content elements 
              referenced in the ci-trigger-command'
              tags:
              - OC_MI
              operationId: oc_ci_get_content
              parameters:
                - name: pathName
                  in: path
                  description: 'the calbback url has a fqdn part followed by the mandatory "OC/CI/content" followed by a path sufixe associated with 
                  the content object to be retrieved according to the MI API'
                  required: true
                  schema:
                    type: string
                    format: uri
              responses:
                200:
                  description: 'returns the requested content (either a file or a playlist gathering the list of files to pre-position)'
                  content:
                    text/plain:
                      schema:
                        type: string
                        format: binary
                404:
                  description: Not found
                  content: {}
      responses:
        201:
          description: Created
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                $ref: 'SVA_OC_CDNI_openapi.yaml#/components/schemas/ci-trigger-status' 
          links:
            getTriggerId:
              operationId: oc_ci_status
              parameters:
                triggerId: '$response.header.Location'
                description: 'the value returned in the "Location" header of the HTTP response is the URL to be used with "GET /OC/CI/status/{triggerId}"'
        400:
          description: Command is invalid
          content: {}
        403:
          description: Forbidden
          content: {}
  /OC/CI/status/{triggerId}:
    get: 
      summary: 'Check the CI trigger status'
      description: 'According to SVA OpenCaching specification and RFC 8007 for the Trigger protcool and RFC 8006'
      tags:
        - OC_CI_trigger
      operationId: oc_ci_status
      parameters:
        - in: path
          name: triggerId
          description: 'the triggerId parameter corresponds to the "Location" header as part of the response 
          corresponding to the /OC/MI/provision API (trigger command)'
          required: true
          schema:
            type: string
            format: url
      responses:
        200:
          description: 'preposioning metatdata/configuration or content status'
          content:
            application/cdni;ptype=ci-trigger-status:
              schema:
                $ref: 'SVA_OC_CDNI_openapi.yaml#/components/schemas/ci-trigger-status'
        304:
          description: 'not modified'
          content: {}
        400:
          description: Command is invalid
          content: {}
        403:
          description: Forbidden
          content: {} 
  /OC/RI/routing_request:
    post:
      tags:
        - OC_RI
      summary: Routing Request API for DNS or HTTP redirect method in recursive mode (RFC 7975)
      description: 'simplification applies regarding RFC 7975. Ther is no CDN traversal and therfore no loop possible. Only one uCDN and one dCDN/ISP'
      operationId: oc_ri_routingrequest
      requestBody:
        description: 'The request according to RFC 7975'
        content:
          application/cdni;ptype=redirection-request:
            schema:
              description: ''
              $ref: 'SVA_OC_CDNI_openapi.yaml#/components/schemas/RI.Request'
        required: true
      responses:
        200:
          description: The RI request is ok
          content:
            application/cdni;ptype=redirection-response:
              schema:
                description: 'the reponse that contains information about the redirection target or an error to be used for building teh response to the user agent'
                $ref: 'SVA_OC_CDNI_openapi.yaml#/components/schemas/RI.Response'
        400:
          description: Command is invalid
        403:
          description: Forbidden
        404:
          description: Not found
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
